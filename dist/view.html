<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT 프로세스 문서 - 흐름 보기</title>
  <style data-shared-styles>
  :root {
    --page-bg: #f5f5f7;
    --page-surface: rgba(255, 255, 255, 0.74);
    --page-surface-strong: rgba(255, 255, 255, 0.92);
    --page-border: rgba(15, 23, 42, 0.08);
    --page-border-strong: rgba(15, 23, 42, 0.12);
    --text-primary: #1d1d1f;
    --text-secondary: #424245;
    --text-tertiary: #6e6e73;
    --text-quaternary: #8e8e93;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-soft: rgba(0, 113, 227, 0.1);
    --warning: #b05c00;
    --warning-bg: rgba(255, 159, 10, 0.12);
    --warning-border: rgba(255, 159, 10, 0.28);
    --shadow-soft: 0 14px 40px rgba(15, 23, 42, 0.08);
    --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.06);
    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 10px;
    --topbar-h: 84px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  [hidden] { display: none !important; }

  html {
    scroll-behavior: smooth;
  }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(circle at top left, rgba(0, 113, 227, 0.16), transparent 30%),
      radial-gradient(circle at top right, rgba(52, 199, 89, 0.12), transparent 24%),
      linear-gradient(180deg, #fbfbfd 0%, var(--page-bg) 34%, #eef2f7 100%);
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  a {
    color: inherit;
  }

  .page-shell {
    width: 100%;
    max-width: 1520px;
    height: 100%;
    margin: 0 auto;
    padding: 18px 8px 20px;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    flex-shrink: 0;
    z-index: 220;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 18px 22px 26px;
    border-bottom: 1px solid var(--page-border);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
  }

  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand-copy h1 {
    display: flex;
    align-items: center;
    gap: 0.42em;
    font-size: clamp(1.2rem, 1rem + 0.6vw, 1.65rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    cursor: pointer;
  }

  .brand-mark {
    display: block;
    flex: 0 0 auto;
    width: auto;
    height: 1em;
  }

  .brand-copy .subtitle {
    margin-top: 6px;
    font-size: 0.9rem;
    color: var(--text-tertiary);
    letter-spacing: -0.01em;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .layout-dropdown {
    position: relative;
    flex-shrink: 0;
  }

  .layout-trigger {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    padding: 7px 11px 7px 8px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: linear-gradient(145deg, #fff, #f5f8fc) padding-box, linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(0, 113, 227, 0.22)) border-box;
    color: var(--text-primary);
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 5px 14px rgba(15, 23, 42, 0.05);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }

  .layout-trigger:hover,
  .layout-trigger[aria-expanded="true"] {
    background: linear-gradient(145deg, #fff, #edf5ff) padding-box, linear-gradient(145deg, rgba(0, 113, 227, 0.18), rgba(0, 113, 227, 0.35)) border-box;
    border-color: rgba(0, 113, 227, 0.24);
    box-shadow: 0 3px 7px rgba(15, 23, 42, 0.04), 0 7px 18px rgba(0, 113, 227, 0.1);
  }

  .layout-trigger:active {
    transform: translateY(1px);
    box-shadow: inset 0 2px 5px rgba(0, 113, 227, 0.08);
  }

  .layout-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(15, 23, 42, 0.06);
    border-radius: 10px;
    background: linear-gradient(145deg, #fff, #edf1f7);
    color: var(--text-secondary);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .layout-trigger-icon {
    width: 32px;
    height: 32px;
    border-color: rgba(0, 113, 227, 0.12);
    background: linear-gradient(145deg, #edf6ff, #dfeeff);
    color: var(--accent);
  }

  .layout-trigger-copy,
  .layout-option-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    min-width: 0;
    line-height: 1.3;
  }

  .layout-trigger-title {
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--text-tertiary);
  }

  #viewModeLabel {
    font-size: 0.8rem;
    font-weight: 650;
    color: var(--accent);
  }

  .layout-chevron {
    flex-shrink: 0;
    color: var(--text-tertiary);
    margin-left: 6px;
    transition: transform 0.18s ease, color 0.18s ease;
  }

  .layout-trigger[aria-expanded="true"] .layout-chevron {
    color: var(--accent);
    transform: rotate(180deg);
  }

  .layout-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 10px);
    z-index: 1;
    width: 240px;
    max-width: calc(100vw - 36px);
    padding: 7px;
    border: 1px solid rgba(15, 23, 42, 0.1);
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 254, 0.97));
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16), 0 3px 8px rgba(15, 23, 42, 0.06), inset 0 1px 0 #fff;
    transform-origin: top right;
  }

  .layout-menu:not([hidden]) {
    animation: layout-menu-in 0.16s ease-out both;
  }

  .layout-menu-heading {
    padding: 7px 10px 10px;
    color: var(--text-tertiary);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .layout-option {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 66px;
    padding: 10px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .layout-option + .layout-option {
    margin-top: 3px;
  }

  .layout-option-copy {
    flex: 1;
  }

  .layout-option-name {
    font-size: 0.82rem;
    font-weight: 650;
  }

  .layout-option-description {
    color: var(--text-tertiary);
    font-size: 0.68rem;
    font-weight: 400;
    word-break: keep-all;
  }

  .layout-option:hover,
  .layout-option:focus-visible {
    background: #eef2f7;
    border-color: rgba(15, 23, 42, 0.06);
  }

  .layout-option[aria-checked="true"] {
    color: var(--text-primary);
    font-weight: 600;
    background: #eaf3ff;
    border-color: rgba(0, 113, 227, 0.1);
  }

  .layout-option[aria-checked="true"]:hover,
  .layout-option[aria-checked="true"]:focus-visible {
    background: #deedff;
  }

  .layout-option[aria-checked="true"] .layout-icon {
    color: var(--accent);
    border-color: rgba(0, 113, 227, 0.14);
    background: linear-gradient(145deg, #fff, #dcecff);
  }

  .layout-check {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.68rem;
    box-shadow: 0 2px 5px rgba(0, 113, 227, 0.18);
    text-align: center;
    visibility: hidden;
  }

  .layout-option[aria-checked="true"] .layout-check {
    visibility: visible;
  }

  .layout-trigger:focus-visible,
  .layout-option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  @keyframes layout-menu-in {
    from { opacity: 0; transform: translateY(-5px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .btn {
    appearance: none;
    border: 1px solid var(--page-border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.72);
    color: var(--text-primary);
    padding: 11px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.9);
    border-color: var(--page-border-strong);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }

  .btn-primary {
    background: linear-gradient(180deg, #1d8cff 0%, var(--accent) 100%);
    border-color: rgba(0, 113, 227, 0.34);
    color: #fff;
  }

  .btn-primary:hover {
    background: linear-gradient(180deg, #2892ff 0%, var(--accent-hover) 100%);
  }

  .page {
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }

  .glass-card {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--page-border);
    border-radius: var(--radius-xl);
    background: var(--page-surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: var(--shadow-soft);
  }

  .glass-card.board-wrapper {
    overflow: visible;
  }

  .filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.86rem;
    font-weight: 700;
  }

  .filter-pill.is-neutral {
    background: rgba(15, 23, 42, 0.05);
    color: var(--text-secondary);
  }

  .board-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 40px 22px;
  }

  .flow-board {
    position: relative;
    width: 100%;
    min-width: 0;
  }

  .flow-header {
    display: grid;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--page-border);
  }

  .flow-menu-toggle {
    display: none;
  }

  .flow-header-cell {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    min-height: 64px;
    padding: 12px 14px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(15, 23, 42, 0.09);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(246, 248, 252, 0.76));
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 8px 20px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    animation: pop-in 0.58s cubic-bezier(0.22, 1.35, 0.36, 1) both;
    animation-delay: calc(var(--enter-delay, 0) * 1ms);
  }

  .flow-header-cell::after {
    content: '';
    position: absolute;
    right: 10px;
    top: 50%;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--cat-color, var(--accent));
    opacity: 0;
    pointer-events: none;
    transform: translate(6px, -50%) scale(0.8);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .flow-header-cell::before {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    z-index: 1;
    width: 12px;
    height: 12px;
    background: #fff;
    clip-path: polygon(0 0, 100% 0, 62% 44%, 62% 100%, 38% 100%, 38% 44%);
    opacity: 0;
    pointer-events: none;
    transform: translate(6px, -50%) scale(0.8);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .flow-header-cell:hover {
    transform: translateY(-3px);
    border-color: var(--cat-color, var(--accent));
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), color-mix(in srgb, var(--cat-color, var(--accent)) 9%, white));
    box-shadow: 0 4px 8px rgba(15, 23, 42, 0.06), 0 14px 28px rgba(15, 23, 42, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.96);
  }

  .flow-header-cell:active {
    transform: translateY(0);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), inset 0 2px 7px rgba(15, 23, 42, 0.1);
  }

  .flow-header-cell:hover::after {
    opacity: 1;
    transform: translate(0, -50%) scale(1);
  }

  .flow-header-cell:hover::before {
    opacity: 1;
    transform: translate(0, -50%) scale(1);
  }

  .flow-header-cell:hover .cat-count {
    opacity: 0;
    transform: translateX(-8px);
  }

  .flow-header-cell.inactive {
    opacity: 0.42;
  }

  .flow-header-cell.active {
    min-height: 48px;
    padding: 6px 14px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--cat-color) 86%, white), var(--cat-color));
    border-color: color-mix(in srgb, var(--cat-color) 72%, #1d1d1f);
    box-shadow: 0 3px 7px color-mix(in srgb, var(--cat-color) 28%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .flow-header-cell.active .cat-icon {
    background: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 1px 3px rgba(15, 23, 42, 0.18);
  }

  .flow-header-cell.active .cat-name,
  .flow-header-cell.active .cat-count {
    color: #fff;
  }

  .flow-header-cell.active .cat-count {
    background: rgba(255, 255, 255, 0.2);
  }

  .flow-header-cell.active::after,
  .flow-header-cell.active::before {
    opacity: 1;
    transform: translate(0, -50%) scale(1);
  }

  .flow-header-cell.active .cat-count {
    opacity: 0;
    transform: translateX(-8px);
  }

  .cat-icon {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-md);
    background: rgba(255, 255, 255, 0.8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 1px 2px rgba(15, 23, 42, 0.12);
    font-size: 0.92rem;
  }

  .cat-text {
    min-width: 0;
  }

  .cat-name {
    display: block;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .cat-count {
    padding: 6px 9px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.88);
    color: var(--cat-color, var(--accent));
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .flow-grid {
    display: grid;
    gap: 12px;
    row-gap: 16px;
    position: relative;
    width: 100%;
  }

  .flow-connectors {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 1;
  }

  .flow-connector {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    opacity: 0;
  }

  .flow-connector.is-visible {
    stroke-dashoffset: 0;
    opacity: 1;
    animation: connector-draw 0.22s ease-out forwards;
  }

  .flow-cell {
    position: relative;
    z-index: 2;
  }

  .flow-cell.hidden {
    display: none;
  }

  .node-card {
    position: relative;
    overflow: hidden;
    padding: 10px 10px 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(15, 23, 42, 0.09);
    background: linear-gradient(135deg, var(--page-surface-strong), rgba(246, 248, 252, 0.82));
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04), 0 8px 20px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.92);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .node-card.is-entering {
    animation: pop-in 0.48s cubic-bezier(0.22, 1.35, 0.36, 1) both;
    animation-delay: calc(var(--enter-delay, 0) * 1ms);
  }

  .node-card::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: linear-gradient(180deg, var(--cat-color, var(--accent)), rgba(29, 29, 31, 0.3));
  }

  .node-card:hover {
    transform: translateY(-6px);
    border-color: var(--cat-color, var(--accent));
    box-shadow: 0 7px 12px rgba(15, 23, 42, 0.08), 0 22px 34px rgba(15, 23, 42, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.96);
  }

  .node-card:active {
    transform: translateY(0);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08), inset 0 2px 7px rgba(15, 23, 42, 0.1);
  }

  .node-head {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    align-items: baseline;
    column-gap: 8px;
    row-gap: 4px;
  }

  .node-index {
    display: block;
    color: var(--text-tertiary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  .node-name {
    min-width: 0;
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1.32;
    letter-spacing: -0.005em;
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .node-details {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
  }

  .node-field {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    font-size: 0.76rem;
    line-height: 1.55;
  }

  .field-label {
    padding-top: 1px;
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.015em;
    color: var(--text-quaternary);
    text-transform: uppercase;
  }

  .field-value {
    min-width: 0;
    color: var(--text-secondary);
    word-break: break-word;
    font-size: 0.72rem;
  }

  .field-value.is-empty {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
    padding: 2px 8px;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--warning);
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: 8px;
  }

  .node-content {
    white-space: pre-wrap;
    cursor: pointer;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .node-content.expanded {
    -webkit-line-clamp: unset;
    line-clamp: unset;
    overflow: visible;
  }

  .node-link {
    text-decoration: underline;
    text-decoration-color: rgba(15, 23, 42, 0.24);
    text-underline-offset: 2px;
    word-break: break-all;
    cursor: pointer;
    color: var(--accent);
  }

  .node-link:hover {
    color: var(--accent-hover);
  }

  .detail-screen { display: none; max-width: 840px; margin: 0 auto; }
  .detail-screen.visible { display: block; }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 36px; }
  .detail-number { color: var(--text-quaternary); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; }
  .detail-name { margin-top: 10px; font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1.18; letter-spacing: -0.035em; }
  .detail-grid { border-top: 1px solid var(--page-border); }
  .detail-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--page-border); font-size: 0.9rem; line-height: 1.7; }
  .detail-label { color: var(--text-quaternary); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }

    render: function(context) {
      const { rows, columns, colIndex, grid, header, legend, helpers } = context;
      const groups = parallelGroups(rows);
      const template = 'repeat(' + columns.length + ', minmax(0, 1fr))';
      header.classList.toggle('is-parallel', !!groups);
      header.style.gridTemplateColumns = groups ? '' : template;
      header.innerHTML = columns.map(function(cat, index) {
        const count = rows.filter(function(row) { return helpers.category(row) === cat; }).length;
        return helpers.headerCell(cat, count, index);
      }).join('');
      legend.innerHTML = '';
      grid.classList.toggle('parallel-flow', !!groups);
      if (groups) {
        const maxBranches = Math.max.apply(null, groups.map(function(group) { return group.items.length; }));
        grid.dataset.parallelColumns = String(maxBranches);
        grid.style.setProperty('--parallel-columns', maxBranches);
        grid.style.gridTemplateColumns = '';
        grid.style.gridTemplateRows = 'repeat(' + groups.length + ', auto)';
      } else {
        delete grid.dataset.parallelColumns;
        grid.style.removeProperty('--parallel-columns');
        grid.style.gridTemplateColumns = template;
        grid.style.gridTemplateRows = 'repeat(' + rows.length + ', auto)';
      }
      const groupedRows = groups ? groups.reduce(function(result, group, rowIndex) {
        const startColumn = Math.floor((Number(grid.dataset.parallelColumns) - group.items.length) / 2) + 1;
        group.items.forEach(function(item, branchIndex) {
          result[item.index] = { step: group.step, column: startColumn + branchIndex, row: rowIndex + 1 };
        });
        return result;
      }, {}) : null;
      grid.innerHTML = rows.map(function(row, index) {
        const cat = helpers.category(row);
        const col = colIndex[cat];
        const parallel = groupedRows && groupedRows[index];
        const stepAttribute = parallel ? ' data-step="' + parallel.step + '"' : '';
        const placement = parallel ? ' style="--parallel-column:' + parallel.column + ';--parallel-row:' + parallel.row + ';grid-column:' + parallel.column + ';grid-row:' + parallel.row + '"' : ' style="grid-column:' + col + ';grid-row:' + (index + 1) + '"';
        return '<div class="flow-cell" data-cat="' + helpers.escape(cat) + '" data-col="' + col + '" data-idx="' + index + '"' + stepAttribute + placement + '>' + helpers.card(row, index, parallel ? 'STEP ' + parallel.step : '') + '</div>';
      }).join('');

    filter: function(context, activeCategory) {
      const toggle = document.getElementById('flowMenuToggle');
      toggle.textContent = activeCategory || '분류 필터';
      toggle.classList.toggle('is-filtered', !!activeCategory);
      const isParallel = context.grid.classList.contains('parallel-flow');
      const categoryRows = {};
      let maxFilterRows = 0;
      let count = 0;
      context.grid.querySelectorAll('.flow-cell').forEach(function(cell) {
        const matches = !activeCategory || cell.dataset.cat === activeCategory;
        const card = cell.querySelector('.node-card');
        const row = (categoryRows[cell.dataset.cat] || 0) + 1;
        categoryRows[cell.dataset.cat] = row;
        maxFilterRows = Math.max(maxFilterRows, row);
        cell.classList.remove('hidden');
        cell.classList.toggle('is-filter-match', !!activeCategory && matches);
        if (card) {
          card.classList.toggle('is-muted', !!activeCategory && !matches);
          card.classList.toggle('is-filter-match', !!activeCategory && matches);
        }
        if (matches) count++;
        if (activeCategory && !isParallel) {
          cell.style.setProperty('--filter-column', cell.dataset.col);
          cell.style.setProperty('--filter-row', String(row));
          cell.style.setProperty('--filter-mobile-row', String(Number(cell.dataset.idx) + 1));

          cell.style.removeProperty('--filter-row');
          cell.style.removeProperty('--filter-mobile-row');

      context.grid.classList.toggle('is-filter-active', !!activeCategory && !isParallel);

        const groups = isParallel ? parallelGroups(context.rows) : null;

    connections: function(context, visibleCells) {
      if (!context.grid.classList.contains('parallel-flow')) return null;
      const steps = new Map();

        const step = Number(cell.dataset.step);
        if (!steps.has(step)) steps.set(step, []);
        steps.get(step).push(cell);
      });
      const groups = Array.from(steps.entries()).sort(function(a, b) { return a[0] - b[0]; });
      const connections = [];
      groups.forEach(function(group, index) {
        const next = groups[index + 1];
        if (!next) return;
        group[1].forEach(function(from) {
          next[1].forEach(function(to) { connections.push([from, to]); });
        });
      });
      return connections;
    },

      const x1 = a.left + a.width / 2 - grid.left;
      const y1 = a.bottom - grid.top;
      const x2 = b.left + b.width / 2 - grid.left;
      const y2 = b.top - grid.top;
      const midY = (y1 + y2) / 2;
      return Math.abs(x1 - x2) < 4
        ? 'M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2
        : 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + midY + ' ' + x2 + ',' + midY + ' ' + x2 + ',' + y2;

    connector: function() { return ''; }
  };
})();

<script>
const STORAGE_KEY = 'it_portal_data_v1';
const LAYOUT_STORAGE_KEY = 'it_portal_layout_v1';

const CAT_CONFIG = {
  '분석': { icon: '🔍', color: '#0a84ff' },
  '설계': { icon: '📐', color: '#5e5ce6' },
  '개발': { icon: '💻', color: '#30b0c7' },
  '검증': { icon: '✅', color: '#ff453a' },
  '운영': { icon: '🚀', color: '#ff9f0a' },
  '계약': { icon: '📝', color: '#34c759' },
  '보안': { icon: '🔐', color: '#bf5af2' }
};
const CATEGORY_PALETTE = ['#0a84ff', '#5e5ce6', '#30b0c7', '#ff453a', '#ff9f0a', '#34c759', '#bf5af2'];
let categoryColors = {};

function assignCategoryColors(categories) {
  categoryColors = {};
  categories.forEach(function(cat, index) {
    categoryColors[cat] = CATEGORY_PALETTE[index % CATEGORY_PALETTE.length];
  });
}

function colorForCategory(cat) {
  if (categoryColors[cat]) return categoryColors[cat];
  if (CAT_CONFIG[cat]) return CAT_CONFIG[cat].color;
  let hash = 0;
  for (let i = 0; i < cat.length; i++) hash = ((hash << 5) - hash) + cat.charCodeAt(i);
  return CATEGORY_PALETTE[Math.abs(hash) % CATEGORY_PALETTE.length];
}

function iconForCategory(cat) {
  return CAT_CONFIG[cat] ? CAT_CONFIG[cat].icon : '◌';
}

// ── EMBEDDED DATA (시크릿 모드용) ──
// __EMBEDDED_DATA_START__
const EMBEDDED_DATA = [];
// __EMBEDDED_DATA_END__

function safeGetSession(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}

// localStorage는 오래된 데이터가 남아있을 수 있어 신뢰하지 않는다.
// input.html에서 방금 넘겨준 sessionStorage 값이거나, 저장(다운로드)된 파일에 내장된 데이터만 사용한다.
function loadData() {
  const sessionData = safeGetSession(STORAGE_KEY);
  if (sessionData) {
    try { return JSON.parse(sessionData); } catch (e) {}
  }
  return EMBEDDED_DATA.length > 0 ? EMBEDDED_DATA : null;
}

function embedSharedStyles(snapshot) {
  const inline = document.querySelector('style[data-shared-styles]');
  const link = document.querySelector('link[data-shared-styles]');
  const target = snapshot.querySelector('link[data-shared-styles], style[data-shared-styles]');
  // Built and previously saved HTML already contains the complete CSS source.
  let css = inline ? inline.textContent : '';
  if (!css.trim() && link) {
    try {
      // Prefer actual live CSS, including edits; never fetch local files.
      const sheet = link.sheet;
      if (sheet && !sheet.disabled) {
        css = Array.from(sheet.cssRules, function(rule) { return rule.cssText; }).join('\n');
      }
    } catch (e) {
      // file:// may block CSSOM; the classic-script companion remains readable.
    }
  }
  if (!css.trim()) {
    css = typeof window.HandbookSharedCss === 'string' ? window.HandbookSharedCss : '';
  }
  if (!css.trim()) throw new Error('공통 스타일 소스가 없거나 비어 있습니다.');

  const style = document.createElement('style');
  style.setAttribute('data-shared-styles', '');
  // Keep CSS text from terminating the style element in serialized HTML.
  style.textContent = css.replace(/<\/style/gi, '\\3c /style');
  if (target) target.replaceWith(style);
  else snapshot.querySelector('head').appendChild(style);
}

function saveAndReturn() {
  const data = loadData();
  if (!data || data.length === 0) {
    alert('저장할 데이터가 없습니다.');
    window.location.href = 'input.html';
    return;
  }

  let scriptEl = null;
  const scripts = document.querySelectorAll('script');
  for (let i = 0; i < scripts.length; i++) {
    if (scripts[i].textContent.indexOf('__EMBEDDED_DATA_START__') !== -1) {
      scriptEl = scripts[i];
      break;
    }
  }
  if (!scriptEl) {
    alert('소스를 찾을 수 없습니다.');
    window.location.href = 'input.html';
    return;
  }

  const serializedData = JSON.stringify(data, null, 2).replace(/</g, '\\u003c');
  const newBlock = '// __EMBEDDED_DATA_START__\nconst EMBEDDED_DATA = ' + serializedData + ';\n// __EMBEDDED_DATA_END__';
  // Bundle the loaded modules without fetch so saving also works with file://.
  const snapshot = document.documentElement.cloneNode(true);
  snapshot.querySelector('#layoutMenu').hidden = true;
  snapshot.querySelector('#layoutMenuButton').setAttribute('aria-expanded', 'false');
  try {
    embedSharedStyles(snapshot);
  } catch (e) {
    // Never export unstyled HTML when every shared CSS source is unavailable.
    alert('공통 스타일을 내장할 수 없어 저장을 중단했습니다. 스타일 파일과 자동 생성된 CSS 소스 스크립트가 있는지 확인해주세요.');
    return;
  }
  snapshot.querySelectorAll('script[data-shared-style-source]').forEach(function(script) { script.remove(); });
  snapshot.querySelectorAll('script[data-view-module]').forEach(function(script) {
    const view = window.HandbookViews[script.dataset.viewModule];
    script.removeAttribute('src');
    script.textContent = view.source;
  });
  snapshot.querySelectorAll('style[data-view-styles]').forEach(function(style) { style.remove(); });
  const fullHtml = '<!DOCTYPE html>\n' + snapshot.outerHTML;
  const updatedHtml = fullHtml.replace(
    /\/\/ __EMBEDDED_DATA_START__[\s\S]*?\/\/ __EMBEDDED_DATA_END__/,
    function() { return newBlock; }
  );

  const blob = new Blob([updatedHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'view.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  alert('저장 완료! (' + data.length + '개 항목)');
}

function updateSaveButtonVisibility() {
  const saveButton = document.getElementById('saveButton');
  if (saveButton) saveButton.hidden = !/debug/i.test(window.location.href);
}

function esc(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function isUrl(str) {
  return /^https?:\/\//i.test((str || '').trim());
}

function openLink(link) {
  if (isUrl(link)) {
    window.open(link, '_blank', 'noopener,noreferrer');
  } else {
    alert('문서 위치: ' + link);
  }
}

let activeCategory = null;
let lastRows = [];
let currentDetailIndex = -1;
let overviewScrollTop = 0;
let overviewBoardScrollTop = 0;
let currentLayout = loadLayoutPreference();

function currentView() {
  return window.HandbookViews[currentLayout] || window.HandbookViews.a;
}

function viewContext() {
  const columns = getColumns(lastRows);
  const colIndex = {};
  columns.forEach(function(cat, index) { colIndex[cat] = index + 1; });
  return {
    rows: lastRows,
    columns: columns,
    colIndex: colIndex,
    grid: document.getElementById('flowGrid'),
    header: document.getElementById('flowHeader'),
    legend: document.getElementById('processLegend'),
    helpers: {
      category: function(row) { return (row.분류 || '').trim() || '미분류'; },
      escape: esc,
      attribute: esc,
      color: colorForCategory,
      card: cardHtml,
      headerCell: headerCellHtml
    }
  };
}

function installViewStyles() {
  Object.keys(window.HandbookViews).forEach(function(key) {
    const style = document.createElement('style');
    style.dataset.viewStyles = key;
    style.textContent = window.HandbookViews[key].styles;
    document.head.appendChild(style);
  });
}

function loadLayoutPreference() {
  const requestedLayout = new URLSearchParams(window.location.search).get('layout');
  if (['a', 'b', 'c', 'd', 'e'].includes(requestedLayout)) return requestedLayout;
  try {
    const savedLayout = localStorage.getItem(LAYOUT_STORAGE_KEY);
    return ['a', 'b', 'c', 'd', 'e'].includes(savedLayout) ? savedLayout : 'a';
  } catch (e) {
    return 'a';
  }
}

function setLayout(layout) {
  currentLayout = ['a', 'b', 'c', 'd', 'e'].includes(layout) ? layout : 'a';
  try { localStorage.setItem(LAYOUT_STORAGE_KEY, currentLayout); } catch (e) {}

  const page = document.querySelector('.page');
  const optionA = document.getElementById('layoutOptionA');
  const optionB = document.getElementById('layoutOptionB');
  const optionC = document.getElementById('layoutOptionC');
  const optionD = document.getElementById('layoutOptionD');
  const optionE = document.getElementById('layoutOptionE');
  if (page) page.classList.toggle('layout-process', currentLayout === 'c');
  if (page) page.classList.toggle('layout-cards', currentLayout === 'b');
  if (page) page.classList.toggle('layout-procedure', currentLayout === 'd');
  if (page) page.classList.toggle('layout-details', currentLayout === 'e');
  document.getElementById('procedureAside').hidden = currentLayout !== 'd';
  document.getElementById('procedureSideDetail').hidden = currentLayout !== 'd';
  if (optionA) optionA.setAttribute('aria-checked', String(currentLayout === 'a'));
  if (optionB) optionB.setAttribute('aria-checked', String(currentLayout === 'b'));
  if (optionC) optionC.setAttribute('aria-checked', String(currentLayout === 'c'));
  if (optionD) optionD.setAttribute('aria-checked', String(currentLayout === 'd'));
  if (optionE) optionE.setAttribute('aria-checked', String(currentLayout === 'e'));
  document.getElementById('viewModeLabel').textContent = currentView().label;
  closeLayoutMenu();

  activeCategory = null;
  closeFlowMenu();
  if (currentDetailIndex >= 0) closeDetail();
  if (lastRows.length) render();
}

function closeLayoutMenu(returnFocus) {
  document.getElementById('layoutMenu').hidden = true;
  const trigger = document.getElementById('layoutMenuButton');
  trigger.setAttribute('aria-expanded', 'false');
  if (returnFocus) trigger.focus();
}

function openLayoutMenu(index) {
  const menu = document.getElementById('layoutMenu');
  const options = Array.from(menu.querySelectorAll('[role="menuitemradio"]'));
  menu.hidden = false;
  document.getElementById('layoutMenuButton').setAttribute('aria-expanded', 'true');
  const target = index === undefined
    ? options.find(function(option) { return option.getAttribute('aria-checked') === 'true'; })
    : options[index];
  (target || options[0]).focus();
}

function toggleLayoutMenu() {
  if (document.getElementById('layoutMenu').hidden) openLayoutMenu();
  else closeLayoutMenu(true);
}

function selectLayout(layout) {
  setLayout(layout);
  document.getElementById('layoutMenuButton').focus();
}

const layoutDropdown = document.getElementById('layoutDropdown');
layoutDropdown.addEventListener('keydown', function(event) {
  const menu = document.getElementById('layoutMenu');
  if (event.key === 'Escape' && !menu.hidden) {
    event.preventDefault();
    event.stopPropagation();
    closeLayoutMenu(true);
    return;
  }
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  event.stopPropagation();
  const options = Array.from(menu.querySelectorAll('[role="menuitemradio"]'));
  const index = options.indexOf(document.activeElement);
  let next;
  if (event.key === 'Home') next = 0;
  else if (event.key === 'End') next = options.length - 1;
  else if (index < 0) next = event.key === 'ArrowUp' ? options.length - 1 : 0;
  else next = (index + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
  openLayoutMenu(next);
});
layoutDropdown.addEventListener('focusout', function(event) {
  if (!layoutDropdown.contains(event.relatedTarget)) closeLayoutMenu();
});
document.addEventListener('click', function(event) {
  if (!layoutDropdown.contains(event.target)) closeLayoutMenu();
});

function toggleCategory(cat) {
  activeCategory = (activeCategory === cat) ? null : cat;
  applyCategoryFilter();
  const boardBody = document.getElementById('boardBody');
  const firstItem = Array.from(document.querySelectorAll('.flow-cell[data-cat], .details-row[data-cat]')).find(function(item) {
    return item.dataset.cat === cat;
  });
  if (boardBody && firstItem) {
    const target = firstItem.querySelector('.node-card') || firstItem;
    const top = target.getBoundingClientRect().top - boardBody.getBoundingClientRect().top + boardBody.scrollTop;
    boardBody.scrollTo({ top: Math.max(0, top - 12), behavior: 'smooth' });
  }
  closeFlowMenu();
}

function toggleFlowMenu() {
  const flowHeader = document.getElementById('flowHeader');
  const toggle = document.getElementById('flowMenuToggle');
  if (!flowHeader || !toggle) return;
  const isOpen = flowHeader.classList.toggle('is-open');
  toggle.setAttribute('aria-expanded', String(isOpen));
}

function closeFlowMenu() {
  const flowHeader = document.getElementById('flowHeader');
  const toggle = document.getElementById('flowMenuToggle');
  if (!flowHeader || !toggle) return;
  flowHeader.classList.remove('is-open');
  toggle.setAttribute('aria-expanded', 'false');
}

function applyCategoryFilter() {
  document.querySelectorAll('.flow-header-cell').forEach(function(el) {
    const cat = el.dataset.cat;
    el.classList.toggle('inactive', !!activeCategory && cat !== activeCategory);
    el.classList.toggle('active', !!activeCategory && cat === activeCategory);
  });

  const visibleCount = currentView().filter(viewContext(), activeCategory);
  updateFilterSummary(visibleCount, lastRows.length);
  drawConnectors();
}

function updateHeaderOffset() {
  const topbar = document.getElementById('topbar');
  const height = topbar ? Math.ceil(topbar.getBoundingClientRect().height) : 84;
  document.documentElement.style.setProperty('--topbar-h', height + 'px');
}

function getColumns(rows) {
  const seen = [];
  rows.forEach(function(r) {
    const cat = (r.분류 || '').trim() || '미분류';
    if (seen.indexOf(cat) === -1) seen.push(cat);
  });
  return seen;
}

function headerCellHtml(cat, count, index) {
  const color = colorForCategory(cat);
  return '<div class="flow-header-cell" data-cat="' + esc(cat) + '" onclick="toggleCategory(\'' + escAttr(cat) + '\')" style="--cat-color:' + color + ';--enter-delay:' + (index * 70) + '">' +
    '<span class="cat-icon">' + iconForCategory(cat) + '</span>' +
    '<span class="cat-text">' +
      '<span class="cat-name">' + esc(cat) + '</span>' +
    '</span>' +
    '<span class="cat-count">' + count + '개</span>' +
  '</div>';
}

function cardHtml(row, idx, indexLabel) {
  const cat = (row.분류 || '').trim() || '미분류';
  const color = colorForCategory(cat);
  let html = '<div class="node-card is-entering" title="' + esc(cat) + '" style="--cat-color:' + color + ';--enter-delay:0" onclick="openDetail(' + idx + ')">';
  html += '<div class="node-head">';
  html += '<span class="node-index">' + esc(indexLabel || '#' + (idx + 1)) + '</span>';
  html += '<span class="node-name">' + esc(row.항목명 || '(항목명 없음)') + '</span>';
  html += '</div>';
  html += row.주관팀 ? '<div class="node-details"><span class="field-value">' + esc(row.주관팀) + '</span></div>' : '';
  html += '</div>';
  return html;
}

function detailField(label, value, isLink) {
  const hasValue = value && String(value).trim();
  let content = hasValue ? esc(String(value)) : '-';
  if (hasValue && isLink) {
    content = String(value).split('\\').map(function(link) {
      const trimmedLink = link.trim();
      if (!trimmedLink) return '';
      return isUrl(trimmedLink)
        ? '<a href="' + esc(trimmedLink) + '" target="_blank" rel="noopener noreferrer">' + esc(trimmedLink) + '</a>'
        : esc(trimmedLink);
    }).filter(Boolean).join('<br>');
  }
  return '<div class="detail-row"><div class="detail-label">' + label + '</div><div class="detail-value' + (hasValue ? '' : ' empty') + '">' + content + '</div></div>';
}

function detailNavigation(index, direction) {
  const row = lastRows[index];
  if (!row) return '<button class="detail-nav-button ' + direction + '" disabled></button>';
  const number = String(index + 1).padStart(2, '0');
  const arrow = direction === 'next' ? '&rarr;' : '&larr;';
  return '<button class="detail-nav-button ' + direction + '" onclick="openDetail(' + index + ')"><span class="detail-nav-number">' + (direction === 'next' ? number + ' ' + arrow : arrow + ' ' + number) + '</span><span class="detail-nav-name">' + esc(row.항목명 || '(항목명 없음)') + '</span></button>';
}

function renderDetail() {
  const row = lastRows[currentDetailIndex];
  const detail = document.getElementById('detailScreen');
  if (!row || !detail) return;
  const category = (row.분류 || '').trim() || '미분류';
  detail.innerHTML = '<div class="detail-top"><div><div class="detail-number">PROCESS ' + String(currentDetailIndex + 1).padStart(2, '0') + ' / ' + lastRows.length + '</div><h2 class="detail-name">' + esc(row.항목명 || '(항목명 없음)') + '</h2></div><button class="btn" onclick="closeDetail()">뒤로가기</button></div><div class="detail-grid">' + detailField('분류', iconForCategory(category) + ' ' + category) + detailField('주관팀', row.주관팀) + detailField('개정일자', row.개정일자) + detailField('문서명', row.문서명) + detailField('문서내용', row.문서내용) + detailField('문서링크', row.문서링크, true) + '</div><nav class="detail-navigation" aria-label="인접 항목 이동">' + detailNavigation(currentDetailIndex - 1, 'previous') + detailNavigation(currentDetailIndex + 1, 'next') + '</nav>';
}

function openDetail(index) {
  if (index < 0 || index >= lastRows.length) return;
  if (currentDetailIndex < 0) {
    overviewScrollTop = window.scrollY;
    overviewBoardScrollTop = document.getElementById('boardBody').scrollTop;
  }
  currentDetailIndex = index;
  renderDetail();
  document.getElementById('flowHeader').style.display = 'none';
  document.getElementById('processLegend').style.display = 'none';
  document.getElementById('flowBoard').style.display = 'none';
  document.getElementById('detailScreen').classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeDetail() {
  currentDetailIndex = -1;
  document.getElementById('detailScreen').classList.remove('visible');
  document.getElementById('flowHeader').style.display = '';
  document.getElementById('processLegend').style.display = '';
  document.getElementById('flowBoard').style.display = '';
  requestAnimationFrame(drawConnectors);
  requestAnimationFrame(function() {
    document.getElementById('boardBody').scrollTop = overviewBoardScrollTop;
    window.scrollTo({ top: overviewScrollTop, behavior: 'auto' });
  });
}

function returnToFlow() {
  currentDetailIndex = -1;
  document.getElementById('detailScreen').classList.remove('visible');
  document.getElementById('flowHeader').style.display = '';
  document.getElementById('processLegend').style.display = '';
  document.getElementById('flowBoard').style.display = '';
  activeCategory = null;
  applyCategoryFilter();
  document.getElementById('boardBody').scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'auto' });
}

window.addEventListener('keydown', function(event) {
  if (event.target.matches('button, a, input, textarea, select')) return;
  if (currentDetailIndex < 0) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    event.preventDefault();
    openDetail(currentDetailIndex - 1);
  } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    event.preventDefault();
    openDetail(currentDetailIndex + 1);
  } else if (event.key === 'Escape') {
    event.preventDefault();
    closeDetail();
  }
});

function drawConnectors() {
  try {
    drawConnectorsInner();
  } catch (e) {
    // 연결선 그리기가 실패해도 카드 데이터는 그대로 보이도록 조용히 무시한다.
  }
}

function drawConnectorsInner() {
  const grid = document.getElementById('flowGrid');
  if (!grid) return;
  let svg = document.getElementById('flowSvg');
  if (svg) {
    svg.setAttribute('width', '0');
    svg.setAttribute('height', '0');
  }
  const gridRect = grid.getBoundingClientRect();
  const width = grid.scrollWidth;
  const height = grid.scrollHeight;

  const visibleCells = Array.from(grid.querySelectorAll('.flow-cell'))
    .filter(function(c) { return !c.classList.contains('hidden'); })
    .sort(function(a, b) { return Number(a.dataset.idx) - Number(b.dataset.idx); });

  let paths = '';
  const viewConnections = currentView().connections
    ? currentView().connections(viewContext(), visibleCells)
    : null;
  const connections = viewConnections || visibleCells.slice(1).map(function(cell, index) {
    return [visibleCells[index], cell];
  });
  connections.forEach(function(connection) {
    const a = connection[0];
    const b = connection[1];
    if (!a || !b) return;
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    const d = currentView().connector(ar, br, gridRect);
    paths += '<path class="flow-connector is-visible" pathLength="1" d="' + d + '" fill="none" stroke="rgba(120, 124, 130, 0.42)" stroke-width="2" marker-end="url(#flowArrow)" />';
  });

  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'flowSvg');
    svg.setAttribute('class', 'flow-connectors');
    grid.appendChild(svg);
  }
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.innerHTML = '<defs><marker id="flowArrow" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto"><path d="M0,0 L0,5 L5,2.5 z" fill="rgba(120, 124, 130, 0.62)" /></marker></defs>' + paths;
}

function formatNumber(num) {
  return String(num || 0);
}

function updateFilterSummary(visibleCount, totalCount) {
  const filterStatus = document.getElementById('filterStatus');
  const boardCopy = document.querySelector('.board-copy p');
  if (!filterStatus && !boardCopy) return;

  if (!activeCategory) {
    if (filterStatus) {
      filterStatus.textContent = '';
      filterStatus.hidden = true;
      filterStatus.classList.add('is-neutral');
    }
    if (boardCopy) boardCopy.textContent = '전체 ' + formatNumber(totalCount) + '개 항목을 입력 순서와 배치대로 보여주고 있습니다. 카드를 눌러 세부 내용을 열 수 있습니다.';
    return;
  }

  if (filterStatus) {
    filterStatus.textContent = activeCategory + ' 분류 ' + formatNumber(visibleCount) + '개 항목 강조 중';
    filterStatus.hidden = false;
    filterStatus.classList.remove('is-neutral');
  }
  if (boardCopy) boardCopy.textContent = activeCategory + ' 분류의 ' + formatNumber(visibleCount) + '개 항목을 강조 표시 중입니다. 나머지 항목도 순서와 배치를 유지해 함께 표시합니다.';
}

function render() {
  try {
    renderInner();
  } catch (e) {
    showRenderError(e);
  }
}

function showRenderError(e) {
  const board = document.getElementById('flowBoard');
  const emptyState = document.getElementById('emptyState');
  if (board) board.style.display = 'none';
  if (emptyState) {
    emptyState.style.display = 'block';
    const msg = e && e.message ? e.message : String(e);
    emptyState.innerHTML = '<h2>화면을 표시하는 중 문제가 발생했습니다</h2>' +
      '<p>' + esc(msg) + '</p>' +
      '<p><a href="input.html">입력 화면</a>으로 돌아가서 다시 시도해주세요.</p>';
  }
}

function renderInner() {
  const rows = loadData() || [];
  const emptyState = document.getElementById('emptyState');
  const board = document.getElementById('flowBoard');

  updateHeaderOffset();

  if (rows.length === 0) {
    board.style.display = 'none';
    emptyState.style.display = 'block';
    updateFilterSummary(0, 0);
    return;
  }
  board.style.display = '';
  emptyState.style.display = 'none';

  const columns = getColumns(rows);
  assignCategoryColors(columns);
  lastRows = rows;

  const flowGrid = document.getElementById('flowGrid');

  document.querySelector('.page').classList.toggle('layout-process', currentLayout === 'c');
  document.querySelector('.page').classList.toggle('layout-cards', currentLayout === 'b');
  document.querySelector('.page').classList.toggle('layout-procedure', currentLayout === 'd');
  document.querySelector('.page').classList.toggle('layout-details', currentLayout === 'e');
  currentView().render(viewContext());
  window.setTimeout(function() {
    flowGrid.querySelectorAll('.node-card.is-entering').forEach(function(card) {
      card.classList.remove('is-entering');
    });
  }, 520);

  activeCategory = null;
  applyCategoryFilter();
}

let resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    updateHeaderOffset();
    if (currentView().rerenderOnResize && currentDetailIndex < 0) render();
    else drawConnectors();
  }, 150);
});

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() {
    updateHeaderOffset();
    drawConnectors();
  });
}

window.addEventListener('load', function() {
  updateHeaderOffset();
  drawConnectors();
});

installViewStyles();
updateSaveButtonVisibility();
setLayout(currentLayout);
render();
</script>
</body>
</html>
