<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT 프로세스 문서 - 흐름 보기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
  :root { --bg:#f7f7f5; --ink:#11110f; --muted:#777770; --faint:#c9c9c1; --line:#bdbdb5; --surface:#efefea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'DM Sans','Noto Sans KR',sans-serif; }
  button { font:inherit; color:inherit; }
  .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; border-bottom:1px solid var(--faint); }
  .identity, .utility, .stage-marker, .eyebrow, .detail-label, .overview-stage { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
  .utility { display:flex; gap:18px; }
  .utility button, .plain-button { border:0; background:none; cursor:pointer; font:inherit; font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
  .utility button:hover, .plain-button:hover { text-decoration:underline; text-underline-offset:4px; }
  .save { border-bottom:1px solid var(--ink)!important; padding-bottom:3px; }
  .process-shell { min-height:calc(100vh - 64px); position:relative; display:grid; place-items:center; padding:56px 8vw 96px; }
  .stage-marker { position:absolute; top:30px; left:32px; display:flex; align-items:center; gap:9px; color:var(--muted); }
  .stage-marker i { width:5px; height:5px; border-radius:50%; background:var(--stage-color); display:block; }
  .mode-toggle { position:absolute; top:30px; right:32px; }
  .focus-view { width:min(1120px,100%); }
  .hero { min-height:300px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; cursor:pointer; outline:none; }
  .eyebrow { color:var(--muted); margin-bottom:12px; }
  .process-number { font-family:'DM Mono',monospace; font-size:clamp(88px,13vw,156px); line-height:.78; letter-spacing:-.08em; }
  .process-name { max-width:900px; margin-top:20px; font-size:clamp(31px,4.2vw,56px); font-weight:500; line-height:1.14; }
  .process-meta { margin-top:18px; font-size:13px; color:var(--muted); }
  .process-meta .accent { color:var(--stage-color); }
  .hero.is-changing { animation:change-out 260ms ease both; }
  @keyframes change-out { to { opacity:0; transform:translateY(-10px); clip-path:inset(0 0 100% 0); } }
  .line-region { position:relative; margin-top:42px; height:96px; cursor:ew-resize; touch-action:pan-y; user-select:none; }
  .process-line, .progress-line { position:absolute; top:48px; height:1px; }
  .process-line { left:0; right:0; background:var(--line); }
  .progress-line { left:0; width:var(--progress); background:var(--ink); transition:width 300ms ease; }
  .current-point { position:absolute; top:42px; left:var(--progress); width:13px; height:13px; border:2px solid var(--bg); background:var(--ink); border-radius:50%; transform:translateX(-50%); transition:left 300ms ease; }
  .lens-node { position:absolute; top:8px; left:calc(var(--progress) + (var(--offset) * 82px)); transform:translateX(-50%); opacity:var(--node-opacity); transition:opacity 180ms ease,transform 180ms ease; pointer-events:none; text-align:center; }
  .lens-node b { display:block; font:500 12px 'DM Mono',monospace; }
  .lens-node span { display:block; max-width:145px; margin-top:4px; font-size:11px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .line-region:not(.is-lensing) .lens-node { opacity:0; }
  .line-region.is-lensing .lens-node { transform:translateX(-50%) scale(var(--node-scale)); }
  .line-region:not(.is-lensing) .lens-node span { display:none; }
  .neighbors { display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-top:46px; }
  .neighbor { border:0; background:none; cursor:pointer; text-align:left; padding:0; min-width:0; color:var(--muted); }
  .neighbor.next { text-align:right; }
  .neighbor:disabled { visibility:hidden; }
  .neighbor small { display:block; font:11px 'DM Mono',monospace; margin-bottom:6px; }
  .neighbor strong { font-size:15px; font-weight:400; line-height:1.35; transition:color 180ms ease; }
  .neighbor:hover strong { color:var(--ink); }
  .branch-choice { margin:24px auto 0; max-width:520px; display:none; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); }
  .branch-choice.visible { display:grid; }
  .branch-choice button { border:0; background:var(--bg); padding:16px; text-align:left; cursor:pointer; font-size:13px; }
  .branch-choice button:hover { background:var(--surface); }
  .chapter { position:absolute; inset:0; z-index:5; display:none; place-items:center; background:var(--bg); text-align:center; }
  .chapter.visible { display:grid; animation:chapter 600ms ease both; }
  .chapter b { display:block; font:12px 'DM Mono',monospace; color:var(--muted); margin-bottom:12px; }
  .chapter strong { font-size:clamp(42px,7vw,76px); font-weight:500; }
  @keyframes chapter { 0%{opacity:0} 30%,70%{opacity:1} 100%{opacity:0} }
  .overview { display:none; width:100%; height:calc(100vh - 160px); overflow:auto; padding:18px 0; }
  .overview.visible, .detail.visible { display:block; }
  .overview-title { margin-bottom:45px; font:10px 'DM Mono',monospace; letter-spacing:.08em; color:var(--muted); }
  .overview-flow { position:relative; display:grid; min-width:900px; gap:18px; padding:0 0 48px; }
  .overview-columns { display:grid; gap:18px; position:sticky; top:0; z-index:2; padding-bottom:14px; background:var(--bg); }
  .overview-column { border-top:2px solid var(--stage-color); padding-top:8px; color:var(--muted); font:10px 'DM Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
  .overview-nodes { display:grid; gap:18px; position:relative; }
  .overview-node { position:relative; z-index:1; width:100%; border:1px solid var(--faint); border-left:3px solid var(--stage-color); border-radius:2px; background:var(--bg); padding:10px 12px; cursor:pointer; text-align:left; }
  .overview-node:hover, .overview-node.current { background:var(--surface); border-color:var(--ink); }
  .overview-node small { display:block; margin-bottom:4px; color:var(--muted); font:10px 'DM Mono',monospace; }
  .overview-node strong { display:block; font-size:13px; font-weight:500; line-height:1.35; }
  .overview-node-details { display:none; margin-top:10px; padding-top:9px; border-top:1px solid var(--faint); color:var(--muted); font-size:11px; line-height:1.55; }
  .overview-node.is-expanded .overview-node-details { display:block; }
  .overview-field { display:grid; grid-template-columns:42px minmax(0,1fr); gap:5px; align-items:baseline; min-width:0; }
  .overview-node-details b { color:var(--ink); font:500 9px 'DM Mono',monospace; letter-spacing:.04em; }
  .overview-node-details em { min-width:0; overflow:hidden; font-style:normal; text-overflow:ellipsis; white-space:nowrap; }
  .overview-connectors { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:visible; }
  .overview-row { display:grid; grid-template-columns:180px 1fr; align-items:center; min-height:50px; border-top:1px solid var(--faint); }
  .overview-stage { color:var(--muted); }
  .overview-points { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
  .overview-point { position:relative; width:8px; height:8px; padding:0; border:0; border-radius:50%; background:var(--ink); opacity:.32; cursor:pointer; }
  .overview-point.current { width:13px; height:13px; opacity:1; background:var(--stage-color); }
  .overview-point:hover::after { content:attr(data-name); position:absolute; left:14px; bottom:12px; z-index:2; width:max-content; max-width:190px; padding:4px 6px; background:var(--ink); color:var(--bg); font:11px 'Noto Sans KR',sans-serif; white-space:normal; text-align:left; }
  .detail { display:none; width:min(760px,100%); }
  .detail-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:45px; }
  .detail-number { font:62px 'DM Mono',monospace; letter-spacing:-.08em; line-height:.8; }
  .detail-name { margin-top:18px; font-size:clamp(30px,4vw,46px); font-weight:500; line-height:1.16; }
  .detail-grid { border-top:1px solid var(--ink); }
  .detail-row { display:grid; grid-template-columns:150px 1fr; gap:24px; padding:21px 0; border-bottom:1px solid var(--faint); font-size:15px; line-height:1.7; }
  .detail-label { padding-top:5px; color:var(--muted); }
  .detail-value { white-space:pre-wrap; word-break:break-word; }
  .detail-value.empty { color:var(--muted); }
  .detail-value a { color:inherit; text-underline-offset:3px; }
  .empty-state { display:none; width:100%; text-align:center; color:var(--muted); font-size:14px; }
  .help-fab { position:fixed; right:22px; bottom:20px; width:30px; height:30px; border:1px solid var(--faint); border-radius:50%; background:var(--bg); cursor:pointer; font:14px 'DM Mono',monospace; }
  @media(max-width:640px) { body{overflow:auto}.topbar{height:56px;padding:0 18px}.utility{gap:12px}.utility .legacy{display:none}.process-shell{min-height:calc(100vh - 56px);display:block;padding:82px 24px 50px}.stage-marker{top:22px;left:24px}.mode-toggle{top:21px;right:24px}.hero{min-height:280px;align-items:flex-start;text-align:left}.process-number{font-size:92px}.process-name{font-size:34px}.line-region{margin:16px 0 0 14px;width:2px;height:138px;cursor:ns-resize}.process-line{top:0;bottom:0;left:0;right:auto;width:1px;height:auto}.progress-line{top:0;left:0;width:1px;height:var(--progress)}.current-point{top:var(--progress);left:-6px;transform:translateY(-50%)}.lens-node{display:none}.neighbors{grid-template-columns:1fr;gap:25px;margin-top:14px}.neighbor.next{text-align:left}.overview{height:calc(100vh - 120px)}.detail-row{grid-template-columns:1fr;gap:7px}.detail-top{margin-bottom:35px} }
  </style>
</head>
<body>
<header class="topbar"><div class="identity">IT PROCESS</div><div class="utility"><button class="legacy" onclick="expandAll()">펼치기</button><button class="legacy" onclick="collapseAll()">접기</button><button class="save" onclick="saveAndReturn()">SAVE</button></div></header>
<main class="process-shell" id="flowBoard" aria-live="polite"><div class="stage-marker" id="stageMarker"></div><button class="plain-button mode-toggle" id="modeToggle" onclick="toggleOverview()">OVERVIEW</button><section class="focus-view" id="focusView"><div class="hero" id="hero" tabindex="0" role="button" aria-label="현재 프로세스 상세 보기" onclick="openDetail()"><div class="eyebrow" id="heroKicker"></div><div class="process-number" id="processNumber"></div><h1 class="process-name" id="processName"></h1><p class="process-meta" id="processMeta"></p></div><div class="line-region" id="lineRegion"><div class="process-line"></div><div class="progress-line"></div><div class="current-point"></div><div id="lensNodes"></div></div><div class="branch-choice" id="branchChoice"></div><nav class="neighbors"><button class="neighbor" id="previousButton" onclick="goPrevious()"></button><button class="neighbor next" id="nextButton" onclick="goNext()"></button></nav></section><section class="overview" id="overview" aria-label="전체 프로세스 개요"></section><section class="detail" id="detail" aria-label="프로세스 상세정보"></section><div class="chapter" id="chapter"></div><div class="empty-state" id="emptyState"><p>표시할 데이터가 없습니다. <a href="input.html">입력 화면</a>에서 항목을 먼저 추가하세요.</p></div></main>
<button class="help-fab" onclick="window.open('https://forms.cloud.microsoft/r/CcsSg1CJcD', '_blank', 'noopener,noreferrer')" title="문의하기" aria-label="문의하기">?</button>
<script>
const STORAGE_KEY='it_portal_data_v1';
const CAT_CONFIG={'분석':{color:'#2563eb'},'설계':{color:'#7c3aed'},'개발':{color:'#059669'},'검증':{color:'#dc2626'},'운영':{color:'#d97706'}};
const FALLBACK_PALETTE=['#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#f97316','#6366f1'];
function colorForCategory(cat){if(CAT_CONFIG[cat])return CAT_CONFIG[cat].color;let hash=0;for(let i=0;i<cat.length;i++)hash=((hash<<5)-hash)+cat.charCodeAt(i);return FALLBACK_PALETTE[Math.abs(hash)%FALLBACK_PALETTE.length];}
// __EMBEDDED_DATA_START__
const EMBEDDED_DATA=[];
// __EMBEDDED_DATA_END__
function safeGetSession(key){try{return sessionStorage.getItem(key)}catch(e){return null}}
function loadData(){const data=safeGetSession(STORAGE_KEY);if(data){try{return JSON.parse(data)}catch(e){}}return EMBEDDED_DATA.length?EMBEDDED_DATA:null}
function saveAndReturn(){const data=loadData();if(!data||!data.length){alert('저장할 데이터가 없습니다.');window.location.href='input.html';return}const block='// __EMBEDDED_DATA_START__\nconst EMBEDDED_DATA = '+JSON.stringify(data,null,2)+';\n// __EMBEDDED_DATA_END__',html=('<!DOCTYPE html>\n'+document.documentElement.outerHTML).replace(/\/\/ __EMBEDDED_DATA_START__[\s\S]*?\/\/ __EMBEDDED_DATA_END__/,block),blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='view2.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);alert('저장 완료! ('+data.length+'개 항목)')}
function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function isUrl(value){return /^https?:\/\//i.test((value||'').trim())}
function openLink(link){if(isUrl(link))window.open(link,'_blank','noopener,noreferrer');else alert('문서 위치: '+link)}
let rows=[],currentIndex=0,mode='overview',overviewExpanded=false,wheelAmount=0,wheelTimer,dragStart,chapterTimer;
function category(row){return(row.분류||'').trim()||'미분류'}
function stageIndex(cat){return Array.from(new Set(rows.map(category))).indexOf(cat)+1}
function setMode(next){mode=next;focusView.style.display=mode==='focus'?'block':'none';overview.classList.toggle('visible',mode==='overview');detail.classList.toggle('visible',mode==='detail');modeToggle.style.visibility=mode==='detail'?'hidden':'visible';modeToggle.textContent=mode==='overview'?'FOCUS':'OVERVIEW';if(mode==='overview')renderOverview();if(mode==='detail')renderDetail()}
function renderCurrent(animate){const row=rows[currentIndex],cat=category(row),index=currentIndex+1;document.documentElement.style.setProperty('--progress',(currentIndex/Math.max(rows.length-1,1)*100)+'%');document.documentElement.style.setProperty('--stage-color',colorForCategory(cat));stageMarker.innerHTML='<i></i><span>'+String(stageIndex(cat)).padStart(2,'0')+' / '+String(new Set(rows.map(category)).size).padStart(2,'0')+' &nbsp; '+esc(cat)+'</span>';if(animate){hero.classList.remove('is-changing');void hero.offsetWidth;hero.classList.add('is-changing');setTimeout(()=>hero.classList.remove('is-changing'),280)}heroKicker.textContent='PROCESS '+String(index).padStart(2,'0')+' / '+String(rows.length).padStart(2,'0');processNumber.textContent=String(index).padStart(2,'0');processName.textContent=row.항목명||'(항목명 없음)';processMeta.innerHTML='<span class="accent">'+esc(cat)+'</span> &nbsp;·&nbsp; '+esc(row.주관팀||'PROCESS');previousButton.disabled=!currentIndex;nextButton.disabled=currentIndex===rows.length-1;previousButton.innerHTML=currentIndex?'<small>&larr; '+String(currentIndex).padStart(2,'0')+'</small><strong>'+esc(rows[currentIndex-1].항목명||'(항목명 없음)')+'</strong>':'';nextButton.innerHTML=currentIndex<rows.length-1?'<small>'+String(index+1).padStart(2,'0')+' &rarr;</small><strong>'+esc(rows[currentIndex+1].항목명||'(항목명 없음)')+'</strong>':'';renderLens();renderBranches()}
function renderLens(){lensNodes.innerHTML='';for(let offset=-2;offset<=2;offset++){const index=currentIndex+offset;if(index<0||index>=rows.length)continue;const el=document.createElement('div');el.className='lens-node';el.style.setProperty('--offset',offset);el.style.setProperty('--node-opacity',offset===0?1:Math.max(.28,.72-Math.abs(offset)*.2));el.style.setProperty('--node-scale',offset===0?1.22:1);el.innerHTML='<b>'+String(index+1).padStart(2,'0')+'</b><span>'+esc(rows[index].항목명||'')+'</span>';lensNodes.appendChild(el)}}
function branchIndexes(){const row=rows[currentIndex],value=row&&(row.다음항목||row.next||row.연결);if(!value)return[];return String(value).split(/[,|]/).map(name=>rows.findIndex(item=>item.항목명===name.trim())).filter(index=>index>=0)}
function renderBranches(){const targets=branchIndexes();branchChoice.innerHTML='';branchChoice.classList.toggle('visible',targets.length>1);targets.forEach(index=>{const button=document.createElement('button');button.textContent=String(index+1).padStart(2,'0')+'  '+(rows[index].항목명||'');button.onclick=()=>goTo(index);branchChoice.appendChild(button)})}
function transitionStage(next,done){const after=category(rows[next]);if(category(rows[currentIndex])===after){done();return}chapter.innerHTML='<div><b>'+String(stageIndex(after)).padStart(2,'0')+'</b><strong>'+esc(after).toUpperCase()+'</strong></div>';chapter.classList.add('visible');clearTimeout(chapterTimer);chapterTimer=setTimeout(()=>{chapter.classList.remove('visible');done()},600)}
function goTo(index){if(index<0||index>=rows.length||index===currentIndex)return;transitionStage(index,()=>{currentIndex=index;renderCurrent(true)})}
function goNext(){const branches=branchIndexes();if(branches.length>1)return;goTo(branches.length?branches[0]:currentIndex+1)}
function goPrevious(){goTo(currentIndex-1)}
function expandAll(){overviewExpanded=true;setMode('overview')}
function collapseAll(){overviewExpanded=false;setMode('overview')}
function toggleOverview(){setMode(mode==='overview'?'focus':'overview')}
function selectOverview(index){currentIndex=index;setMode('focus');renderCurrent(true)}
function renderOverview(){const groups=[];rows.forEach((row,index)=>{const cat=category(row),group=groups.find(value=>value.cat===cat);if(group)group.items.push({row,index});else groups.push({cat,items:[{row,index}]})});overview.innerHTML='<p class="overview-title">PROCESS OVERVIEW / '+rows.length+' ITEMS</p>'+groups.map((group,groupIndex)=>'<div class="overview-row"><div class="overview-stage">'+String(groupIndex+1).padStart(2,'0')+' '+esc(group.cat).toUpperCase()+'</div><div class="overview-points">'+group.items.map(item=>'<button class="overview-point '+(item.index===currentIndex?'current':'')+'" style="--stage-color:'+colorForCategory(group.cat)+'" data-name="'+esc(item.row.항목명||'')+'" aria-label="'+esc(item.row.항목명||'')+'" onclick="selectOverview('+item.index+')"></button>').join('')+'</div></div>').join('')}
function overviewField(label,value){return '<span class="overview-field"><b>'+label+'</b><em title="'+esc(value||'미입력')+'">'+esc(value||'미입력')+'</em></span>'}
function renderOverview(){const columns=Array.from(new Set(rows.map(category))),colIndex={};columns.forEach((cat,index)=>colIndex[cat]=index+1);const template='repeat('+columns.length+', minmax(170px, 1fr))';overview.innerHTML='<p class="overview-title">PROCESS OVERVIEW / '+rows.length+' ITEMS</p><div class="overview-flow" id="overviewFlow"><div class="overview-columns" style="grid-template-columns:'+template+'">'+columns.map(cat=>'<div class="overview-column" style="--stage-color:'+colorForCategory(cat)+'">'+esc(cat)+'</div>').join('')+'</div><div class="overview-nodes" id="overviewNodes" style="grid-template-columns:'+template+';grid-template-rows:repeat('+rows.length+', auto)">'+rows.map((row,index)=>'<button class="overview-node '+(overviewExpanded?'is-expanded ':'')+(index===currentIndex?'current':'')+'" id="overviewNode'+index+'" style="--stage-color:'+colorForCategory(category(row))+';grid-column:'+colIndex[category(row)]+';grid-row:'+(index+1)+'" onclick="selectOverview('+index+')"><small>#'+String(index+1).padStart(2,'0')+'</small><strong>'+esc(row.항목명||'(항목명 없음)')+'</strong><span class="overview-node-details">'+overviewField('주관팀',row.주관팀)+overviewField('개정일',row.개정일자)+overviewField('문서명',row.문서명)+overviewField('내용',row.문서내용)+overviewField('링크',row.문서링크)+'</span></button>').join('')+'<svg class="overview-connectors" id="overviewSvg" aria-hidden="true"></svg></div></div>';requestAnimationFrame(drawOverviewConnectors)}
function drawOverviewConnectors(){const nodes=document.getElementById('overviewNodes'),svg=document.getElementById('overviewSvg');if(!nodes||!svg)return;const rect=nodes.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+nodes.clientWidth+' '+nodes.clientHeight);let paths='';for(let index=0;index<rows.length-1;index++){const from=document.getElementById('overviewNode'+index).getBoundingClientRect(),to=document.getElementById('overviewNode'+(index+1)).getBoundingClientRect(),x1=from.left+from.width/2-rect.left,y1=from.bottom-rect.top,x2=to.left+to.width/2-rect.left,y2=to.top-rect.top,mid=(y1+y2)/2;paths+='<path d="M'+x1+' '+y1+' C'+x1+' '+mid+' '+x2+' '+mid+' '+x2+' '+y2+'" fill="none" stroke="#c9c9c1" stroke-width="1.5" marker-end="url(#overviewArrow)"/>'}svg.innerHTML='<defs><marker id="overviewArrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#c9c9c1"/></marker></defs>'+paths}
function detailField(label,value,link){let content=value?esc(value):'미입력';if(value&&link&&isUrl(value))content='<a href="'+esc(value)+'" target="_blank" rel="noopener noreferrer">'+esc(value)+'</a>';return '<div class="detail-row"><div class="detail-label">'+label+'</div><div class="detail-value '+(!value?'empty':'')+'">'+content+'</div></div>'}
function renderDetail(){const row=rows[currentIndex];detail.innerHTML='<div class="detail-top"><div><div class="detail-number">'+String(currentIndex+1).padStart(2,'0')+'</div><h2 class="detail-name">'+esc(row.항목명||'(항목명 없음)')+'</h2></div><button class="plain-button" onclick="setMode(\'focus\')">BACK</button></div><div class="detail-grid">'+detailField('STAGE',category(row))+detailField('OWNER',row.주관팀)+detailField('REVISED',row.개정일자)+detailField('DOCUMENT',row.문서명)+detailField('CONTENT',row.문서내용)+detailField('LINK',row.문서링크,true)+'</div>'}
function openDetail(){setMode('detail')}
function handleWheel(event){if(mode!=='focus')return;event.preventDefault();wheelAmount+=event.deltaY;clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{if(Math.abs(wheelAmount)>55)wheelAmount>0?goNext():goPrevious();wheelAmount=0},80)}
function handleKey(event){if(event.target.matches('button,a'))return;if(event.key==='ArrowRight'||event.key==='ArrowDown'){event.preventDefault();goNext()}else if(event.key==='ArrowLeft'||event.key==='ArrowUp'){event.preventDefault();goPrevious()}else if(event.key==='Enter'&&mode==='focus')openDetail();else if(event.key==='Escape'&&mode!=='focus')setMode('focus');else if(event.code==='Space'){event.preventDefault();toggleOverview()}}
function initInteractions(){lineRegion.addEventListener('pointerdown',event=>{dragStart={x:event.clientX,y:event.clientY,index:currentIndex};lineRegion.setPointerCapture(event.pointerId)});lineRegion.addEventListener('pointermove',event=>{if(!dragStart)return;const vertical=matchMedia('(max-width:640px)').matches,delta=vertical?event.clientY-dragStart.y:event.clientX-dragStart.x,target=Math.max(0,Math.min(rows.length-1,dragStart.index-Math.round(delta/(vertical?55:100))));if(target!==currentIndex){currentIndex=target;renderCurrent(false)}});lineRegion.addEventListener('pointerup',()=>dragStart=null);lineRegion.addEventListener('pointerleave',()=>lineRegion.classList.remove('is-lensing'));lineRegion.addEventListener('pointerenter',()=>lineRegion.classList.add('is-lensing'));window.addEventListener('wheel',handleWheel,{passive:false});window.addEventListener('keydown',handleKey)}
function render(){rows=loadData()||[];if(!rows.length){flowBoard.style.display='none';emptyState.style.display='block';return}renderCurrent(false);setMode('overview');initInteractions()}
render();
</script>
</body>
