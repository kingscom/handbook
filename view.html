<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT 프로세스 문서 - 흐름 보기</title>
  <style>
  :root {
    --page-bg: #f5f5f7;
    --page-surface: rgba(255, 255, 255, 0.74);
    --page-surface-strong: rgba(255, 255, 255, 0.92);
    --page-border: rgba(15, 23, 42, 0.08);
    --page-border-strong: rgba(15, 23, 42, 0.12);
    --text-primary: #1d1d1f;
    --text-secondary: #424245;
    --text-tertiary: #6e6e73;
    --text-quaternary: #8e8e93;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-soft: rgba(0, 113, 227, 0.1);
    --warning: #b05c00;
    --warning-bg: rgba(255, 159, 10, 0.12);
    --warning-border: rgba(255, 159, 10, 0.28);
    --shadow-soft: 0 14px 40px rgba(15, 23, 42, 0.08);
    --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.06);
    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 10px;
    --topbar-h: 84px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-behavior: smooth;
  }

  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro KR', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(circle at top left, rgba(0, 113, 227, 0.16), transparent 30%),
      radial-gradient(circle at top right, rgba(52, 199, 89, 0.12), transparent 24%),
      linear-gradient(180deg, #fbfbfd 0%, var(--page-bg) 34%, #eef2f7 100%);
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  a {
    color: inherit;
  }

  .page-shell {
    width: 100%;
    max-width: 1520px;
    height: 100%;
    margin: 0 auto;
    padding: 18px 16px 20px;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    flex-shrink: 0;
    z-index: 220;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 22px 20px;
    border-bottom: 1px solid var(--page-border);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
  }

  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand-copy h1 {
    font-size: clamp(1.2rem, 1rem + 0.6vw, 1.65rem);
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .brand-copy .subtitle {
    margin-top: 6px;
    font-size: 0.9rem;
    color: var(--text-tertiary);
    letter-spacing: -0.01em;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--page-border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.72);
    color: var(--text-primary);
    padding: 11px 16px;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.9);
    border-color: var(--page-border-strong);
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }

  .btn-primary {
    background: linear-gradient(180deg, #1d8cff 0%, var(--accent) 100%);
    border-color: rgba(0, 113, 227, 0.34);
    color: #fff;
  }

  .btn-primary:hover {
    background: linear-gradient(180deg, #2892ff 0%, var(--accent-hover) 100%);
  }

  .page {
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }

  .glass-card {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--page-border);
    border-radius: var(--radius-xl);
    background: var(--page-surface);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: var(--shadow-soft);
  }

  .filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 700;
  }

  .filter-pill.is-neutral {
    background: rgba(15, 23, 42, 0.05);
    color: var(--text-secondary);
  }

  .board-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 22px;
  }

  .flow-board {
    position: relative;
    width: 100%;
    min-width: 0;
  }

  .flow-header {
    display: grid;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--page-border);
  }

  .flow-header-cell {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    min-height: 64px;
    padding: 12px 14px;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(15, 23, 42, 0.08);
    background: rgba(255, 255, 255, 0.74);
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    cursor: pointer;
    user-select: none;
    transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .flow-header-cell:hover {
    transform: translateY(-2px);
    border-color: rgba(15, 23, 42, 0.16);
  }

  .flow-header-cell.inactive {
    opacity: 0.42;
  }

  .flow-header-cell.active {
    min-height: 48px;
    padding: 6px 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 249, 255, 0.98));
    border-color: rgba(0, 113, 227, 0.2);
  }

  .cat-icon {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-md);
    background: rgba(255, 255, 255, 0.8);
    font-size: 0.92rem;
  }

  .cat-text {
    min-width: 0;
  }

  .cat-name {
    display: block;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .cat-count {
    padding: 6px 9px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.88);
    color: var(--cat-color, var(--accent));
    font-size: 0.72rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .flow-grid {
    display: grid;
    gap: 12px;
    row-gap: 12px;
    position: relative;
    width: 100%;
  }

  .flow-connectors {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 1;
  }

  .flow-cell {
    position: relative;
    z-index: 2;
  }

  .flow-cell.hidden {
    display: none;
  }

  .node-card {
    position: relative;
    overflow: hidden;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid rgba(15, 23, 42, 0.08);
    background: var(--page-surface-strong);
    box-shadow: var(--shadow-card);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    animation: float-up 0.5s ease both;
  }

  .node-card::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: linear-gradient(180deg, var(--cat-color, var(--accent)), rgba(29, 29, 31, 0.3));
  }

  .node-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 32px rgba(15, 23, 42, 0.1);
    border-color: rgba(15, 23, 42, 0.14);
  }

  .node-head {
    display: grid;
    grid-template-columns: 16px 28px minmax(0, 1fr);
    align-items: start;
    gap: 5px;
    cursor: pointer;
  }

  .node-toggle { border: 0; cursor: pointer; }

  .node-toggle {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.04);
    color: var(--text-tertiary);
    font-size: 0.58rem;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .node-index {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 16px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.04);
    color: var(--text-tertiary);
    font-size: 0.56rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    flex-shrink: 0;
    line-height: 1.1;
    margin-top: 1px;
  }

  .node-name {
    min-width: 0;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.32;
    letter-spacing: -0.005em;
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .node-details {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(15, 23, 42, 0.08);
  }

  .node-card.expanded .node-details {
    display: flex;
  }

  .node-field {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 8px;
    align-items: start;
    font-size: 0.76rem;
    line-height: 1.55;
  }

  .field-label {
    padding-top: 1px;
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.015em;
    color: var(--text-quaternary);
    text-transform: uppercase;
  }

  .field-value {
    min-width: 0;
    color: var(--text-secondary);
    word-break: break-word;
  }

  .field-value.is-empty {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
    padding: 2px 8px;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--warning);
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: 8px;
  }

  .node-content {
    white-space: pre-wrap;
    cursor: pointer;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .node-content.expanded {
    -webkit-line-clamp: unset;
    line-clamp: unset;
    overflow: visible;
  }

  .node-link {
    text-decoration: underline;
    text-decoration-color: rgba(15, 23, 42, 0.24);
    text-underline-offset: 2px;
    word-break: break-all;
    cursor: pointer;
    color: var(--accent);
  }

  .node-link:hover {
    color: var(--accent-hover);
  }

  .detail-screen { display: none; max-width: 840px; margin: 0 auto; }
  .detail-screen.visible { display: block; }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 36px; }
  .detail-number { color: var(--text-quaternary); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; }
  .detail-name { margin-top: 10px; font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1.18; letter-spacing: -0.035em; }
  .detail-grid { border-top: 1px solid var(--page-border); }
  .detail-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--page-border); font-size: 0.9rem; line-height: 1.7; }
  .detail-label { color: var(--text-quaternary); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; }
  .detail-value { white-space: pre-wrap; word-break: break-word; }
  .detail-value.empty { color: var(--text-tertiary); }
  .detail-value a { color: var(--accent); text-underline-offset: 3px; }
  .detail-navigation { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; }
  .detail-nav-button { min-width: 0; padding: 14px 16px; border: 1px solid var(--page-border); border-radius: var(--radius-md); background: var(--page-surface-strong); color: var(--text-primary); cursor: pointer; text-align: left; }
  .detail-nav-button.next { text-align: right; }
  .detail-nav-button:disabled { visibility: hidden; }
  .detail-nav-number { display: block; margin-bottom: 5px; color: var(--text-quaternary); font-size: 0.68rem; font-weight: 700; }
  .detail-nav-name { display: block; overflow: hidden; font-size: 0.82rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }

  .empty-state {
    text-align: center;
    padding: 96px 24px;
    color: var(--text-tertiary);
  }

  .empty-state h2 {
    font-size: 1.4rem;
    margin-bottom: 10px;
    color: var(--text-primary);
    letter-spacing: -0.03em;
  }

  .empty-state p {
    font-size: 0.94rem;
    line-height: 1.7;
  }

  .empty-state a {
    color: var(--accent);
    text-decoration: none;
  }

  .help-fab {
    position: fixed;
    right: 26px;
    bottom: 26px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(180deg, #1d8cff 0%, var(--accent) 100%);
    color: #fff;
    border: 1px solid rgba(0, 113, 227, 0.36);
    cursor: pointer;
    box-shadow: 0 18px 32px rgba(0, 113, 227, 0.22);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .help-fab:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 22px 36px rgba(0, 113, 227, 0.3);
  }

  @keyframes float-up {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 860px) {
    .page-shell {
      padding: 10px 10px 12px;
    }

    .topbar-row {
      align-items: flex-start;
      flex-direction: column;
    }

    .topbar-actions {
      width: 100%;
      justify-content: flex-start;
    }

    .board-body {
      padding: 20px;
    }
  }

  @media (max-width: 640px) {
    .flow-header-cell,
    .node-card {
      border-radius: var(--radius-lg);
    }

    .node-field {
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .detail-top { flex-direction: column; }
    .detail-navigation { grid-template-columns: 1fr; }
    .detail-row { grid-template-columns: 1fr; gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    * {
      animation: none !important;
      transition: none !important;
    }
  }

  @supports not (display: grid) {
    .flow-header,
    .flow-grid {
      display: flex;
      flex-wrap: wrap;
    }

    .flow-header-cell,
    .flow-cell {
      flex: 0 0 200px;
      margin: 0 12px 12px 0;
    }

    .flow-connectors {
      display: none;
    }
  }
  </style>
</head>
<body>

<div class="page-shell">
  <main class="page">
    <div class="glass-card board-wrapper">
      <header class="topbar" id="topbar">
        <div class="topbar-row">
          <div class="brand-copy">
            <div class="eyebrow">Flow Review</div>
            <h1>IT 프로세스 흐름을 더 명확한 Apple식 정보 계층으로 정리했습니다.</h1>
            <div class="subtitle">분류는 가로 축에, 입력 순서는 세로 흐름에 배치해 전체 문맥을 빠르게 읽을 수 있습니다.</div>
          </div>
          <div class="topbar-actions">
            <button class="btn" onclick="expandAll()">전체 펼치기</button>
            <button class="btn" onclick="collapseAll()">전체 접기</button>
            <button class="btn btn-primary" onclick="saveAndReturn()" title="저장 후 최종 HTML로 다운로드">저장</button>
          </div>
        </div>
        <div class="flow-header" id="flowHeader"></div>
      </header>
      <div class="board-body">
        <div class="flow-board" id="flowBoard">
          <div class="flow-grid" id="flowGrid"></div>
        </div>
        <section class="detail-screen" id="detailScreen" aria-label="프로세스 상세정보"></section>
        <div class="empty-state" id="emptyState" style="display:none;">
          <h2>표시할 데이터가 없습니다</h2>
          <p><a href="input.html">입력 화면</a>에서 항목을 먼저 추가하세요.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<button class="help-fab" onclick="window.open('https://forms.cloud.microsoft/r/CcsSg1CJcD', '_blank', 'noopener,noreferrer')" title="문의하기" aria-label="문의하기">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <rect x="2" y="3" width="20" height="14" rx="7" fill="#fff"/>
    <path d="M8 17 L8 21.5 L12.5 17 Z" fill="#fff"/>
    <text x="12" y="14" text-anchor="middle" font-size="10" font-weight="800" fill="#0071e3" font-family="'Segoe UI', Arial, sans-serif">?</text>
  </svg>
</button>

<script>
const STORAGE_KEY = 'it_portal_data_v1';

const CAT_CONFIG = {
  '분석': { icon: '🔍', color: '#0a84ff' },
  '설계': { icon: '📐', color: '#5e5ce6' },
  '개발': { icon: '🛠', color: '#30b0c7' },
  '검증': { icon: '✅', color: '#ff453a' },
  '운영': { icon: '🚀', color: '#ff9f0a' }
};
const FALLBACK_PALETTE = ['#0a84ff', '#30b0c7', '#64d2ff', '#ff9f0a', '#ff453a', '#34c759', '#bf5af2', '#5ac8fa'];

function colorForCategory(cat) {
  if (CAT_CONFIG[cat]) return CAT_CONFIG[cat].color;
  let hash = 0;
  for (let i = 0; i < cat.length; i++) hash = ((hash << 5) - hash) + cat.charCodeAt(i);
  return FALLBACK_PALETTE[Math.abs(hash) % FALLBACK_PALETTE.length];
}

function iconForCategory(cat) {
  return CAT_CONFIG[cat] ? CAT_CONFIG[cat].icon : '◌';
}

// ── EMBEDDED DATA (시크릿 모드용) ──
// __EMBEDDED_DATA_START__
const EMBEDDED_DATA = [];
// __EMBEDDED_DATA_END__

function safeGetSession(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}

// localStorage는 오래된 데이터가 남아있을 수 있어 신뢰하지 않는다.
// input.html에서 방금 넘겨준 sessionStorage 값이거나, 저장(다운로드)된 파일에 내장된 데이터만 사용한다.
function loadData() {
  const sessionData = safeGetSession(STORAGE_KEY);
  if (sessionData) {
    try { return JSON.parse(sessionData); } catch (e) {}
  }
  return EMBEDDED_DATA.length > 0 ? EMBEDDED_DATA : null;
}

function saveAndReturn() {
  const data = loadData();
  if (!data || data.length === 0) {
    alert('저장할 데이터가 없습니다.');
    window.location.href = 'input.html';
    return;
  }

  let scriptEl = null;
  const scripts = document.querySelectorAll('script');
  for (let i = 0; i < scripts.length; i++) {
    if (scripts[i].textContent.indexOf('__EMBEDDED_DATA_START__') !== -1) {
      scriptEl = scripts[i];
      break;
    }
  }
  if (!scriptEl) {
    alert('소스를 찾을 수 없습니다.');
    window.location.href = 'input.html';
    return;
  }

  const newBlock = '// __EMBEDDED_DATA_START__\nconst EMBEDDED_DATA = ' + JSON.stringify(data, null, 2) + ';\n// __EMBEDDED_DATA_END__';
  const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const updatedHtml = fullHtml.replace(
    /\/\/ __EMBEDDED_DATA_START__[\s\S]*?\/\/ __EMBEDDED_DATA_END__/,
    newBlock
  );

  const blob = new Blob([updatedHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'view.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  alert('저장 완료! (' + data.length + '개 항목)');
}

function esc(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function isUrl(str) {
  return /^https?:\/\//i.test((str || '').trim());
}

function openLink(link) {
  if (isUrl(link)) {
    window.open(link, '_blank', 'noopener,noreferrer');
  } else {
    alert('문서 위치: ' + link);
  }
}

function toggleContent(el) {
  el.classList.toggle('expanded');
}

function toggleCard(headEl) {
  const card = headEl.closest('.node-card');
  if (!card) return;
  card.classList.toggle('expanded');
  const t = headEl.querySelector('.node-toggle');
  if (t) t.textContent = card.classList.contains('expanded') ? '▾' : '▸';
  requestAnimationFrame(drawConnectors);
}

let activeCategory = null;
let lastRows = [];
let currentDetailIndex = -1;

function toggleCategory(cat) {
  activeCategory = (activeCategory === cat) ? null : cat;
  applyCategoryFilter();
}

function applyCategoryFilter() {
  document.querySelectorAll('.flow-header-cell').forEach(function(el) {
    const cat = el.dataset.cat;
    el.classList.toggle('inactive', !!activeCategory && cat !== activeCategory);
    el.classList.toggle('active', !!activeCategory && cat === activeCategory);
  });

  let visibleRow = 0;
  let visibleCount = 0;
  document.querySelectorAll('.flow-cell').forEach(function(el) {
    const cat = el.dataset.cat;
    const isVisible = !activeCategory || cat === activeCategory;
    el.classList.toggle('hidden', !isVisible);
    if (!isVisible) return;

    visibleCount++;
    visibleRow++;
    if (activeCategory) {
      el.style.gridRow = visibleRow;
      el.style.gridColumn = el.dataset.col;
    } else {
      el.style.gridRow = Number(el.dataset.idx) + 1;
      el.style.gridColumn = el.dataset.col;
    }
  });

  updateFilterSummary(visibleCount, lastRows.length);
  requestAnimationFrame(drawConnectors);
}

function expandAll() {
  document.querySelectorAll('.node-card').forEach(function(card) {
    card.classList.add('expanded');
    const t = card.querySelector('.node-toggle');
    if (t) t.textContent = '▾';
  });
  requestAnimationFrame(drawConnectors);
}

function collapseAll() {
  document.querySelectorAll('.node-card').forEach(function(card) {
    card.classList.remove('expanded');
    const t = card.querySelector('.node-toggle');
    if (t) t.textContent = '▸';
  });
  requestAnimationFrame(drawConnectors);
}

function updateHeaderOffset() {
  const topbar = document.getElementById('topbar');
  const height = topbar ? Math.ceil(topbar.getBoundingClientRect().height) : 84;
  document.documentElement.style.setProperty('--topbar-h', height + 'px');
}

function getColumns(rows) {
  const seen = [];
  rows.forEach(function(r) {
    const cat = (r.분류 || '').trim() || '미분류';
    if (seen.indexOf(cat) === -1) seen.push(cat);
  });
  return seen;
}

function headerCellHtml(cat, count) {
  const color = colorForCategory(cat);
  return '<div class="flow-header-cell" data-cat="' + esc(cat) + '" onclick="toggleCategory(\'' + escAttr(cat) + '\')" style="--cat-color:' + color + '">' +
    '<span class="cat-icon">' + iconForCategory(cat) + '</span>' +
    '<span class="cat-text">' +
      '<span class="cat-name">' + esc(cat) + '</span>' +
    '</span>' +
    '<span class="cat-count">' + count + '개</span>' +
  '</div>';
}

function cellHtml(row, idx, col) {
  const cat = (row.분류 || '').trim() || '미분류';
  const color = colorForCategory(cat);
  let html = '<div class="flow-cell" data-cat="' + esc(cat) + '" data-col="' + col + '" style="grid-column:' + col + ';grid-row:' + (idx + 1) + ';" data-idx="' + idx + '">';
  html += '<div class="node-card" style="--cat-color:' + color + '" onclick="openDetail(' + idx + ')">';
  html += '<div class="node-head">';
  html += '<button class="node-toggle" onclick="event.stopPropagation();toggleCard(this.closest(\'.node-head\'))" aria-label="세부 정보 펼치기">▸</button>';
  html += '<span class="node-index">#' + (idx + 1) + '</span>';
  html += '<span class="node-name">' + esc(row.항목명 || '(항목명 없음)') + '</span>';
  html += '</div>';
  html += '<div class="node-details">';
  html += fieldRow('주관팀', row.주관팀);
  html += fieldRow('개정일자', row.개정일자);
  html += fieldRow('문서명', row.문서명);
  html += fieldRow('문서내용', row.문서내용, 'content');
  html += fieldRow('문서링크', row.문서링크, 'link');
  html += '</div>';
  html += '</div></div>';
  return html;
}

function fieldRow(label, value, kind) {
  const has = value && value.trim();
  let valueHtml;
  if (!has) {
    valueHtml = '<span class="field-value is-empty">미입력</span>';
  } else if (kind === 'content') {
    valueHtml = '<span class="field-value node-content" onclick="toggleContent(this)">' + esc(value) + '</span>';
  } else if (kind === 'link') {
    valueHtml = '<span class="field-value node-link" onclick="openLink(\'' + escAttr(value) + '\')">' + esc(value) + '</span>';
  } else {
    valueHtml = '<span class="field-value">' + esc(value) + '</span>';
  }
  return '<div class="node-field"><span class="field-label">' + esc(label) + '</span>' + valueHtml + '</div>';
}

function detailField(label, value, isLink) {
  const hasValue = value && String(value).trim();
  let content = hasValue ? esc(String(value)) : '미입력';
  if (hasValue && isLink && isUrl(String(value))) content = '<a href="' + esc(String(value)) + '" target="_blank" rel="noopener noreferrer">' + esc(String(value)) + '</a>';
  return '<div class="detail-row"><div class="detail-label">' + label + '</div><div class="detail-value' + (hasValue ? '' : ' empty') + '">' + content + '</div></div>';
}

function detailNavigation(index, direction) {
  const row = lastRows[index];
  if (!row) return '<button class="detail-nav-button ' + direction + '" disabled></button>';
  const number = String(index + 1).padStart(2, '0');
  const arrow = direction === 'next' ? '&rarr;' : '&larr;';
  return '<button class="detail-nav-button ' + direction + '" onclick="openDetail(' + index + ')"><span class="detail-nav-number">' + (direction === 'next' ? number + ' ' + arrow : arrow + ' ' + number) + '</span><span class="detail-nav-name">' + esc(row.항목명 || '(항목명 없음)') + '</span></button>';
}

function renderDetail() {
  const row = lastRows[currentDetailIndex];
  const detail = document.getElementById('detailScreen');
  if (!row || !detail) return;
  detail.innerHTML = '<div class="detail-top"><div><div class="detail-number">PROCESS ' + String(currentDetailIndex + 1).padStart(2, '0') + ' / ' + lastRows.length + '</div><h2 class="detail-name">' + esc(row.항목명 || '(항목명 없음)') + '</h2></div><button class="btn" onclick="closeDetail()">목록으로</button></div><div class="detail-grid">' + detailField('분류', (row.분류 || '').trim() || '미분류') + detailField('주관팀', row.주관팀) + detailField('개정일자', row.개정일자) + detailField('문서명', row.문서명) + detailField('문서내용', row.문서내용) + detailField('문서링크', row.문서링크, true) + '</div><nav class="detail-navigation" aria-label="인접 항목 이동">' + detailNavigation(currentDetailIndex - 1, 'previous') + detailNavigation(currentDetailIndex + 1, 'next') + '</nav>';
}

function openDetail(index) {
  if (index < 0 || index >= lastRows.length) return;
  currentDetailIndex = index;
  renderDetail();
  document.getElementById('flowBoard').style.display = 'none';
  document.getElementById('detailScreen').classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeDetail() {
  currentDetailIndex = -1;
  document.getElementById('detailScreen').classList.remove('visible');
  document.getElementById('flowBoard').style.display = 'block';
  requestAnimationFrame(drawConnectors);
}

window.addEventListener('keydown', function(event) {
  if (event.target.matches('button, a, input, textarea, select')) return;
  if (currentDetailIndex < 0) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    event.preventDefault();
    openDetail(currentDetailIndex - 1);
  } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    event.preventDefault();
    openDetail(currentDetailIndex + 1);
  } else if (event.key === 'Escape') {
    event.preventDefault();
    closeDetail();
  }
});

function drawConnectors() {
  try {
    drawConnectorsInner();
  } catch (e) {
    // 연결선 그리기가 실패해도 카드 데이터는 그대로 보이도록 조용히 무시한다.
  }
}

function drawConnectorsInner() {
  const grid = document.getElementById('flowGrid');
  if (!grid) return;
  const gridRect = grid.getBoundingClientRect();
  const width = grid.scrollWidth;
  const height = grid.scrollHeight;

  const visibleCells = Array.from(grid.querySelectorAll('.flow-cell'))
    .filter(function(c) { return !c.classList.contains('hidden'); })
    .sort(function(a, b) { return Number(a.dataset.idx) - Number(b.dataset.idx); });

  let paths = '';
  for (let i = 0; i < visibleCells.length - 1; i++) {
    const a = visibleCells[i];
    const b = visibleCells[i + 1];
    if (!a || !b) continue;
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    const x1 = ar.left + ar.width / 2 - gridRect.left;
    const y1 = ar.bottom - gridRect.top;
    const x2 = br.left + br.width / 2 - gridRect.left;
    const y2 = br.top - gridRect.top;
    const midY = (y1 + y2) / 2;
    const d = Math.abs(x1 - x2) < 4
      ? 'M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2
      : 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + midY + ' ' + x2 + ',' + midY + ' ' + x2 + ',' + y2;
    paths += '<path d="' + d + '" fill="none" stroke="rgba(120, 124, 130, 0.42)" stroke-width="2" marker-end="url(#flowArrow)" />';
  }

  let svg = document.getElementById('flowSvg');
  if (!svg) {
    svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'flowSvg');
    svg.setAttribute('class', 'flow-connectors');
    grid.appendChild(svg);
  }
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.innerHTML = '<defs><marker id="flowArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="rgba(120, 124, 130, 0.62)" /></marker></defs>' + paths;
}

function formatNumber(num) {
  return String(num || 0);
}

function updateFilterSummary(visibleCount, totalCount) {
  const filterStatus = document.getElementById('filterStatus');
  const boardCopy = document.querySelector('.board-copy p');
  if (!filterStatus && !boardCopy) return;

  if (!activeCategory) {
    if (filterStatus) {
      filterStatus.textContent = '전체 분류를 표시 중';
      filterStatus.classList.add('is-neutral');
    }
    if (boardCopy) boardCopy.textContent = '전체 ' + formatNumber(totalCount) + '개 항목을 입력 순서대로 보여주고 있습니다. 카드를 눌러 세부 내용을 열고, 분류 헤더를 눌러 해당 영역만 집중해서 볼 수 있습니다.';
    return;
  }

  if (filterStatus) {
    filterStatus.textContent = activeCategory + '만 표시 중';
    filterStatus.classList.remove('is-neutral');
  }
  if (boardCopy) boardCopy.textContent = activeCategory + ' 분류의 ' + formatNumber(visibleCount) + '개 항목만 모아 보고 있습니다. 헤더를 다시 누르면 전체 보기로 돌아갑니다.';
}

function render() {
  try {
    renderInner();
  } catch (e) {
    showRenderError(e);
  }
}

function showRenderError(e) {
  const board = document.getElementById('flowBoard');
  const emptyState = document.getElementById('emptyState');
  if (board) board.style.display = 'none';
  if (emptyState) {
    emptyState.style.display = 'block';
    const msg = e && e.message ? e.message : String(e);
    emptyState.innerHTML = '<h2>화면을 표시하는 중 문제가 발생했습니다</h2>' +
      '<p>' + esc(msg) + '</p>' +
      '<p><a href="input.html">입력 화면</a>으로 돌아가서 다시 시도해주세요.</p>';
  }
}

function renderInner() {
  const rows = loadData() || [];
  const emptyState = document.getElementById('emptyState');
  const board = document.getElementById('flowBoard');

  updateHeaderOffset();

  if (rows.length === 0) {
    board.style.display = 'none';
    emptyState.style.display = 'block';
    updateFilterSummary(0, 0);
    return;
  }
  board.style.display = 'block';
  emptyState.style.display = 'none';

  const columns = getColumns(rows);
  const colIndex = {};
  columns.forEach(function(c, i) { colIndex[c] = i + 1; });
  lastRows = rows;

  const flowHeader = document.getElementById('flowHeader');
  const flowGrid = document.getElementById('flowGrid');

  const templateColumns = 'repeat(' + columns.length + ', minmax(0, 1fr))';
  flowHeader.style.gridTemplateColumns = templateColumns;
  flowGrid.style.gridTemplateColumns = templateColumns;
  flowGrid.style.gridTemplateRows = 'repeat(' + rows.length + ', auto)';

  flowHeader.innerHTML = columns.map(function(cat) {
    const count = rows.filter(function(r) { return ((r.분류 || '').trim() || '미분류') === cat; }).length;
    return headerCellHtml(cat, count);
  }).join('');

  let cellsHtml = '';
  rows.forEach(function(row, idx) {
    const cat = (row.분류 || '').trim() || '미분류';
    cellsHtml += cellHtml(row, idx, colIndex[cat]);
  });
  flowGrid.innerHTML = cellsHtml;

  activeCategory = null;
  applyCategoryFilter();
  requestAnimationFrame(drawConnectors);
}

let resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    updateHeaderOffset();
    drawConnectors();
  }, 150);
});

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() {
    updateHeaderOffset();
    drawConnectors();
  });
}

window.addEventListener('load', function() {
  updateHeaderOffset();
  drawConnectors();
});

render();
</script>
</body>
</html>
