<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT 프로세스 문서 트리 맵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root {
    --color-bg: #f8fafc;
    --color-surface: #ffffff;
    --color-border: #e2e8f0;
    --color-text: #1e293b;
    --color-text-muted: #64748b;
    --color-text-faint: #94a3b8;
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-danger: #ef4444;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 200;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--color-text);
    line-height: 1.3;
  }
  header .subtitle {
    font-size: 0.8rem;
    color: var(--color-text-muted);
    margin-top: 3px;
  }
  .header-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 50vw;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .header-center .flow-item {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid currentColor;
    background: #f8fafc;
    font-size: 0.8rem;
    font-weight: 600;
    vertical-align: middle;
  }
  .header-center .flow-sep {
    color: var(--color-text-faint);
    margin: 0 8px;
    font-size: 0.85rem;
    vertical-align: middle;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: var(--radius);
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: #f1f5f9; }
  .btn-primary {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--color-primary-hover); }

  /* ── MAIN ── */
  .main-content {
    padding: 24px 24px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── CATEGORY BLOCK ── */
  .category-block {
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--cat-color, var(--color-primary));
    background: var(--color-surface);
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--color-text);
    border-bottom: 1px solid var(--color-border);
    background: #f8fafc;
  }
  .category-header .icon { font-size: 0.9rem; }
  .category-header .cat-count {
    margin-left: auto;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    background: #eff6ff;
    color: var(--cat-color, var(--color-primary));
  }

  /* ── TREE AREA ── */
  .tree-area {
    padding: 16px 18px 18px 16px;
  }

  ul.tree-list {
    list-style: none;
  }

  .tree-item {
    position: relative;
    padding: 6px 0;
  }

  /* ── NODE CARD ── */
  .node-card {
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: default;
    transition: box-shadow 0.15s, transform 0.12s, border-color 0.15s;
    max-width: 600px;
    vertical-align: top;
    background: var(--color-surface);
    position: relative;
    z-index: 10;
  }
  .node-card:hover {
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    transform: translateY(-1px);
    border-color: var(--cat-color, var(--color-primary));
  }
  .node-card.has-docs.has-link { cursor: pointer; }

  .node-name {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--color-text);
    line-height: 1.3;
  }
  .node-date {
    font-size: 0.72rem;
    color: var(--color-text-muted);
    font-weight: 400;
  }

  .doc-team {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 1px 7px;
    margin-left: 4px;
    border-radius: 999px;
    background: #eff6ff;
    color: var(--cat-color, var(--color-primary));
  }

  .doc-content-tip {
    font-size: 0.78rem;
    color: var(--color-text);
    max-width: 100%;
    line-height: 1.5;
    margin-top: 2px;
    white-space: pre-wrap;
  }
  .doc-link-text {
    margin-top: 4px;
    font-size: 0.75rem;
    color: var(--color-text-muted);
    line-height: 1.35;
    word-break: break-all;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--color-text-faint);
    text-underline-offset: 2px;
  }
  .doc-link-text:hover {
    color: var(--color-primary);
  }

  /* ── NO DATA ── */
  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--color-text-faint);
  }
  .no-data h2 { font-size: 1rem; margin-bottom: 8px; color: var(--color-text); }
  .no-data p { font-size: 0.85rem; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    z-index: 500; display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--color-surface); border-radius: 10px; max-width: 520px; width: 92%;
    padding: 24px; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
    position: relative; border-top: 4px solid var(--color-primary);
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    font-size: 1.1rem; cursor: pointer; color: var(--color-text-faint); background: none; border: none; font-family: inherit;
  }
  .modal-close:hover { color: var(--color-text); }
  .modal-cat { font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; color: var(--color-primary); }
  .modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; color: var(--color-text); }
  .modal-docs { display: flex; flex-direction: column; gap: 10px; }
  .modal-doc-item { background: #f8fafc; border-radius: 8px; padding: 12px; border: 1px solid var(--color-border); }
  .modal-doc-item .row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 5px; }
  .modal-doc-item .label { font-size: 0.72rem; color: var(--color-text-faint); width: 60px; flex-shrink: 0; }
  .modal-doc-item .value { font-size: 0.82rem; color: var(--color-text); font-weight: 500; }
  .modal-doc-item .value-link { cursor: pointer; text-decoration: underline; color: var(--color-primary); }
  .modal-doc-item .content-text { font-size: 0.8rem; color: var(--color-text-muted); line-height: 1.5; margin-top: 4px; white-space: pre-wrap; }
  .modal-doc-index { font-size: 0.72rem; font-weight: 700; color: var(--color-text-faint); margin-bottom: 6px; }
  .modal-empty { color: var(--color-text-faint); font-size: 0.85rem; }

  /* ── SCROLL ── */
  .scroll-top-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--color-primary); color: #fff;
    border: none; border-radius: 50%; width: 42px; height: 42px;
    font-size: 1rem; cursor: pointer; box-shadow: 0 3px 12px rgba(15, 23, 42, 0.25);
    transition: all 0.15s; z-index: 100;
  }
  .scroll-top-btn:hover { background: var(--color-primary-hover); transform: scale(1.06); }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🌳 IT 프로세스 문서 트리 맵</h1>
    <div class="subtitle">분류별 항목명 목록</div>
  </div>
  <div class="header-center" id="legendArea"></div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="saveAndReturn()" title="저장 후 편집으로 돌아가기">💾 저장</button>
  </div>
</header>

<div class="main-content" id="mainContent">
  <div class="no-data" id="noDataMsg" style="display:none;">
    <h2>표시할 데이터가 없습니다</h2>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-docs" id="modalDocs"></div>
  </div>
</div>

<button class="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="맨 위로">↑</button>

<script>
const STORAGE_KEY = 'it_portal_data_v1';

const CAT_CONFIG = {
  '분석': { icon: '🔍', color: '#2563eb', label: '분석' },
  '설계': { icon: '📐', color: '#7c3aed', label: '설계' },
  '개발': { icon: '🛠', color: '#059669', label: '개발' },
  '검증': { icon: '✅', color: '#dc2626', label: '검증' },
  '운영': { icon: '🚀', color: '#d97706', label: '운영' }
};

const CAT_ORDER = ['분석', '설계', '개발', '검증', '운영'];

function colorForUnknownCategory(cat) {
  const palette = ['#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316', '#6366f1'];
  let hash = 0;
  for (let i = 0; i < cat.length; i++) hash = ((hash << 5) - hash) + cat.charCodeAt(i);
  return palette[Math.abs(hash) % palette.length];
}

function getCatCfg(cat) {
  const base = CAT_CONFIG[cat] || { icon: '⚪', color: colorForUnknownCategory(cat), label: cat };
  return base;
}

// ── EMBEDDED DATA (시크릿 모드용) ──
// __EMBEDDED_DATA_START__
const EMBEDDED_DATA = [];
// __EMBEDDED_DATA_END__

// 저장소 접근 자체가 예외를 던질 수 있어(보안 정책으로 차단된 VDI 등) 항상 try/catch로 감싸 사용한다.
function safeGetSession(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}

// ── LOAD DATA ──
// localStorage는 오래된 데이터가 남아있을 수 있어 신뢰하지 않는다.
// input.html에서 방금 넘겨준 sessionStorage 값이거나, 저장(다운로드)된 파일에 내장된 데이터만 사용한다.
function loadData() {
  // 1. sessionStorage 확인 (input.html에서 방금 넘어온 경우)
  const sessionData = safeGetSession('it_portal_data_v1');
  if (sessionData) {
    try { return JSON.parse(sessionData); } catch { }
  }

  // 2. embedded data (저장된 최종 HTML 파일을 다시 연 경우)
  return EMBEDDED_DATA.length > 0 ? EMBEDDED_DATA : null;
}

function saveAndReturn() {
  var data = loadData();
  if (!data || data.length === 0) {
    alert('저장할 데이터가 없습니다.');
    window.location.href = 'input.html';
    return;
  }

  // 현재 스크립트 태그에서 소스 추출
  var scriptEl = null;
  var scripts = document.querySelectorAll('script');
  for (var i = 0; i < scripts.length; i++) {
    if (scripts[i].textContent.indexOf('__EMBEDDED_DATA_START__') !== -1) {
      scriptEl = scripts[i];
      break;
    }
  }

  if (!scriptEl) {
    alert('소스를 찾을 수 없습니다.');
    window.location.href = 'input.html';
    return;
  }

  var newBlock = '// __EMBEDDED_DATA_START__\nconst EMBEDDED_DATA = ' + JSON.stringify(data, null, 2) + ';\n// __EMBEDDED_DATA_END__';
  var newScriptContent = scriptEl.textContent.replace(
    /\/\/ __EMBEDDED_DATA_START__[\s\S]*?\/\/ __EMBEDDED_DATA_END__/,
    newBlock
  );

  // 전체 HTML 재구성: <head>...</head><body>...</body> 교체
  var fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  // outerHTML의 script 내용을 교체 (마커 기반)
  var updatedHtml = fullHtml.replace(
    /\/\/ __EMBEDDED_DATA_START__[\s\S]*?\/\/ __EMBEDDED_DATA_END__/,
    newBlock
  );

  var blob = new Blob([updatedHtml], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'view.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  alert('✓ 저장 완료! (' + data.length + '개 항목)\n');
}

// ── BUILD NODE LIST (분류별 평면 목록) ──
function buildTree(rows) {
  const catNodeMap = {};
  const catOrder = [];

  rows.forEach(r => {
    if (!r.항목명) return;
    if (!catNodeMap[r.분류]) {
      catNodeMap[r.분류] = new Map();
      if (!catOrder.includes(r.분류)) catOrder.push(r.분류);
    }
    const map = catNodeMap[r.분류];
    const key = r.항목명;
    if (!map.has(key)) {
      map.set(key, { 항목명: r.항목명, 분류: r.분류, docs: [] });
    }
    const node = map.get(key);
    if (r.주관팀 || r.개정일자 || r.문서링크 || r.문서내용) {
      node.docs.push({
        주관팀: r.주관팀 || '',
        개정일자: r.개정일자 || '',
        문서링크: r.문서링크 || '',
        문서내용: r.문서내용 || ''
      });
    }
  });

  const sortedCats = CAT_ORDER.filter(c => catNodeMap[c]).concat(
    catOrder.filter(c => !CAT_ORDER.includes(c))
  );

  const catNodes = {};
  sortedCats.forEach(cat => {
    catNodes[cat] = Array.from(catNodeMap[cat].values());
  });

  return { catNodes, sortedCats };
}

// ── RENDER ──
function render() {
  const rows = loadData();
  const container = document.getElementById('mainContent');
  const noData = document.getElementById('noDataMsg');

  if (!rows || rows.length === 0) {
    noData.style.display = 'block';
    renderLegend([]);
    return;
  }
  noData.style.display = 'none';

  const { catNodes, sortedCats } = buildTree(rows);
  renderLegend(sortedCats);

  let html = '';
  sortedCats.forEach(cat => {
    const cfg = getCatCfg(cat);
    const nodes = catNodes[cat] || [];

    html += `<div class="category-block" style="--cat-color:${cfg.color};">`;
    html += `<div class="category-header">
               <span class="icon">${cfg.icon}</span>
               <span>${escHtml(cat)}</span>
               <span class="cat-count">${nodes.length}개 항목</span>
             </div>`;
    html += `<div class="tree-area">`;
    html += `<ul class="tree-list">`;
    nodes.forEach(node => {
      html += `<li class="tree-item root-item">${renderNodeCard(node, cat, cfg)}</li>`;
    });
    html += `</ul>`;
    html += `</div></div>`;
  });

  container.innerHTML = noData.outerHTML + html;
  document.getElementById('noDataMsg').style.display = 'none';
}

// 노드 카드 렌더링
function renderNodeCard(node, cat, cfg) {
  const hasDocs = node.docs && node.docs.length > 0;
  const firstDoc = hasDocs ? node.docs[0] : null;
  const hasLink = hasDocs && firstDoc.문서링크;
  let html = `<div class="node-card${hasDocs ? ' has-docs' : ''}${hasLink ? ' has-link' : ''}"
    ${hasLink ? `onclick="event.stopPropagation();showDocLink('${escAttr(firstDoc.문서링크)}')"` : ''}>`;
  html += `<div class="node-name">${escHtml(node.항목명)}`;
  if (hasDocs && firstDoc.개정일자) html += ` <span class="node-date">(${escHtml(firstDoc.개정일자)})</span>`;
  if (hasDocs && firstDoc.주관팀) html += ` <span class="doc-team">${escHtml(firstDoc.주관팀)}</span>`;
  html += `</div>`;
  if (hasDocs && firstDoc.문서내용) html += `<div class="doc-content-tip">${escHtml(firstDoc.문서내용)}</div>`;
  if (hasDocs && firstDoc.문서링크) {
    html += `<div class="doc-link-text" onclick="event.stopPropagation();showDocLink('${escAttr(firstDoc.문서링크)}')">${escHtml(firstDoc.문서링크)}</div>`;
  }
  html += `</div>`;
  return html;
}

// ── MODAL ──
let _modalData = {};

function buildModalData(rows) {
  const map = {};
  rows.forEach(r => {
    if (!r.항목명) return;
    const k = `${r.분류}||${r.항목명}`;
    if (!map[k]) map[k] = { 분류: r.분류, 항목명: r.항목명, docs: [] };
    if (r.주관팀 || r.개정일자 || r.문서링크 || r.문서내용) {
      map[k].docs.push({ 주관팀: r.주관팀||'', 개정일자: r.개정일자||'', 문서링크: r.문서링크||'', 문서내용: r.문서내용||'' });
    }
  });
  return map;
}

function showModal(cat, itemName) {
  const rows = loadData() || [];
  if (!_modalData || Object.keys(_modalData).length === 0) {
    _modalData = buildModalData(rows);
  }
  const key = `${cat}||${itemName}`;
  const data = _modalData[key];
  if (!data) return;

  const cfg = getCatCfg(cat);
  const catEl = document.getElementById('modalCat');
  catEl.textContent = cat;
  catEl.style.color = cfg.color;

  document.getElementById('modalTitle').textContent = itemName;

  const docsEl = document.getElementById('modalDocs');
  if (data.docs.length === 0) {
    docsEl.innerHTML = '<p class="modal-empty">문서 정보가 없습니다.</p>';
  } else {
    docsEl.innerHTML = data.docs.map((doc, i) => `
      <div class="modal-doc-item">
        ${data.docs.length > 1 ? `<div class="modal-doc-index">문서 ${i+1}</div>` : ''}
        ${doc.주관팀 ? `<div class="row"><span class="label">주관팀</span><span class="value">${escHtml(doc.주관팀)}</span></div>` : ''}
        ${doc.개정일자 ? `<div class="row"><span class="label">개정일자</span><span class="value">${escHtml(doc.개정일자)}</span></div>` : ''}
        ${doc.문서링크 ? `<div class="row"><span class="label">문서 위치</span><span class="value value-link" onclick="showDocLink('${escAttr(doc.문서링크)}')">${escHtml(doc.문서링크)}</span></div>` : ''}
        ${doc.문서내용 ? `<div class="content-text">${escHtml(doc.문서내용)}</div>` : ''}
      </div>
    `).join('');
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
});

function showDocLink(link) {
  if (/^https?:\/\//i.test(link)) {
    window.open(link, '_blank', 'noopener,noreferrer');
  } else {
    alert('문서 위치: ' + link + '\n\n(URL인 경우 주소창에 직접 입력하세요)');
  }
}

// ── LEGEND ──
function renderLegend(cats) {
  const area = document.getElementById('legendArea');
  const activeCats = CAT_ORDER.filter(c => cats.includes(c)).concat(
    cats.filter(c => !CAT_ORDER.includes(c))
  );
  area.innerHTML = activeCats.map((c, idx) => {
    const cfg = getCatCfg(c);
    const sep = idx < activeCats.length - 1 ? '<span class="flow-sep">></span>' : '';
    return `<span class="flow-item" style="color:${cfg.color}">${escHtml(cfg.label)}</span>${sep}`;
  }).join('');
}

// ── HELPERS ──
function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(str) {
  return (str || '').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
function truncate(str, max) {
  return str.length > max ? str.slice(0, max) + '…' : str;
}

render();
requestAnimationFrame(fixTreeConnectors);
